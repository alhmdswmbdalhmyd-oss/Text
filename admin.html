<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NEXO STORE</title>

<style>
:root{
  --primary:#6c4cff;
  --secondary:#171326;
  --bg:#f4f5f9;
  --card:#fff;
  --text:#171717;
  --muted:#777;
  --border:#e7e7e7;
  --danger:#e53935;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.hidden{
  display:none!important;
}

/* =========================
   HEADER
========================= */

header{
  background:var(--secondary);
  color:#fff;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
}

/* =========================
   HERO
========================= */

.hero{
  background:
    radial-gradient(circle at top right,#6c4cff55,transparent 35%),
    linear-gradient(135deg,#11101b,#281b48);

  color:#fff;
  padding:65px 20px;
  text-align:center;
}

.hero h1{
  font-size:42px;
  margin-bottom:15px;
}

.hero p{
  color:#ddd;
  max-width:700px;
  margin:auto;
  line-height:1.8;
}

/* =========================
   SEARCH
========================= */

.search-area{
  max-width:1100px;
  margin:-25px auto 25px;
  padding:0 15px;
  position:relative;
  z-index:5;
}

.search-box{
  background:#fff;
  padding:15px;
  border-radius:18px;
  box-shadow:0 10px 35px #00000015;
}

.search-box input{
  width:100%;
  border:1px solid var(--border);
  padding:14px 16px;
  border-radius:12px;
  outline:none;
}

.search-box input:focus{
  border-color:var(--primary);
}

/* =========================
   PRODUCTS
========================= */

.container{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:20px 15px 50px;
}

.section-title{
  font-size:28px;
  margin-bottom:20px;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product-card{
  background:var(--card);
  border-radius:20px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 5px 20px #00000008;
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-4px);
  box-shadow:0 15px 35px #00000012;
}

.product-image{
  width:100%;
  height:230px;
  object-fit:cover;
  display:block;
  background:#eee;
}

.no-image{
  width:100%;
  height:230px;
  background:
    linear-gradient(135deg,#eee,#ddd);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#888;
  font-size:50px;
}

.product-body{
  padding:17px;
}

.product-name{
  font-size:19px;
  font-weight:bold;
  margin-bottom:9px;
}

.product-description{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
  min-height:45px;
}

.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:16px;
}

.product-price{
  color:var(--primary);
  font-size:19px;
  font-weight:bold;
}

.buy-btn{
  background:var(--primary);
  color:#fff;
  padding:10px 14px;
  border-radius:11px;
  font-weight:bold;
}

.buy-btn:hover{
  opacity:.9;
}

/* =========================
   EMPTY
========================= */

.empty{
  background:#fff;
  border-radius:18px;
  padding:50px 20px;
  text-align:center;
  color:#777;
  border:1px solid var(--border);
}

/* =========================
   LOADING
========================= */

.loading{
  text-align:center;
  padding:50px;
  color:#777;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:550px;
  max-height:90vh;
  overflow:auto;
  border-radius:22px;
  padding:22px;
}

.modal-title{
  font-size:23px;
  font-weight:bold;
  margin-bottom:18px;
}

.modal-image{
  width:100%;
  max-height:350px;
  object-fit:contain;
  background:#eee;
  border-radius:15px;
  margin-bottom:18px;
}

.modal-description{
  line-height:1.8;
  color:#555;
  margin-bottom:18px;
}

.modal-price{
  color:var(--primary);
  font-size:25px;
  font-weight:bold;
  margin-bottom:18px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input{
  width:100%;
  border:1px solid var(--border);
  padding:12px;
  border-radius:10px;
  outline:none;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  padding:12px 17px;
  border-radius:11px;
  font-weight:bold;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-light{
  background:#eee;
  color:#222;
}

/* =========================
   FOOTER
========================= */

footer{
  background:var(--secondary);
  color:#fff;
  text-align:center;
  padding:30px 15px;
  margin-top:30px;
}

footer p{
  color:#bbb;
  margin-top:8px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

  .products-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:700px){

  header{
    padding:0 15px;
  }

  .logo{
    font-size:21px;
  }

  .hero{
    padding:45px 15px;
  }

  .hero h1{
    font-size:31px;
  }

  .products-grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product-image,
  .no-image{
    height:190px;
  }

  .product-body{
    padding:13px;
  }

  .product-name{
    font-size:17px;
  }

  .product-price{
    font-size:17px;
  }

  .buy-btn{
    padding:9px 10px;
    font-size:13px;
  }

}

@media(max-width:430px){

  .products-grid{
    grid-template-columns:1fr;
  }

  .product-image,
  .no-image{
    height:250px;
  }

}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

  <div class="logo" id="storeName">
    NEXO STORE
  </div>

  <div class="header-left">
    <span id="currencyHeader">ر.س</span>
  </div>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

  <h1 id="heroTitle">
    NEXO STORE
  </h1>

  <p id="heroDescription">
    متجر إلكتروني
  </p>

</section>


<!-- =========================
     SEARCH
========================= -->

<div class="search-area">

  <div class="search-box">

    <input
      id="searchInput"
      type="search"
      placeholder="ابحث عن منتج..."
      oninput="filterProducts()"
    >

  </div>

</div>


<!-- =========================
     PRODUCTS
========================= -->

<main class="container">

  <h2 class="section-title">
    المنتجات
  </h2>

  <div id="productsContainer">

    <div class="loading">
      جاري تحميل المنتجات...
    </div>

  </div>

</main>


<!-- =========================
     PRODUCT MODAL
========================= -->

<div
  id="productModal"
  class="modal hidden"
  onclick="closeModal(event)"
>

  <div
    class="modal-box"
    onclick="event.stopPropagation()"
  >

    <div class="modal-title" id="modalName">
      المنتج
    </div>

    <img
      id="modalImage"
      class="modal-image hidden"
      alt=""
    >

    <div
      id="modalDescription"
      class="modal-description"
    ></div>

    <div
      id="modalPrice"
      class="modal-price"
    ></div>

    <div
      id="modalForm"
      class="hidden"
    >

      <div class="form-group">

        <label>
          الاسم
        </label>

        <input
          id="customerName"
          type="text"
          placeholder="اسمك"
        >

      </div>

      <div class="form-group">

        <label>
          رقم الجوال
        </label>

        <input
          id="customerPhone"
          type="tel"
          placeholder="05xxxxxxxx"
        >

      </div>

    </div>

    <div class="actions">

      <button
        id="buyButton"
        class="btn btn-primary"
        onclick="buyProduct()"
      >
        طلب المنتج
      </button>

      <button
        class="btn btn-light"
        onclick="closeModal()"
      >
        إغلاق
      </button>

    </div>

  </div>

</div>


<!-- =========================
     FOOTER
========================= -->

<footer>

  <strong id="footerStoreName">
    NEXO STORE
  </strong>

  <p id="footerDescription">
    متجر إلكتروني
  </p>

</footer>


<script>

/* =========================================================
   NEXO STORE
   قراءة المنتجات والصور من IndexedDB
   نفس قاعدة بيانات لوحة الإدارة
========================================================= */

const DB_NAME = "NEXO_STORE_DATABASE";
const DB_VERSION = 1;

const PRODUCT_STORE = "products";
const IMAGE_STORE = "product_images";

let db = null;

let products = [];

let filteredProducts = [];

let selectedProduct = null;

let settings = null;


/* =========================================================
   فتح قاعدة البيانات
========================================================= */

function openDatabase(){

  return new Promise((resolve,reject)=>{

    if(db){

      resolve(db);

      return;

    }

    const request =
      indexedDB.open(DB_NAME,DB_VERSION);


    request.onupgradeneeded = function(event){

      const database =
        event.target.result;


      /*
       * هذه الحماية مهمة.
       * إذا كانت قاعدة البيانات موجودة
       * فلن يتم حذف أي شيء.
       */

      if(
        !database.objectStoreNames.contains(
          PRODUCT_STORE
        )
      ){

        database.createObjectStore(
          PRODUCT_STORE,
          {
            keyPath:"id"
          }
        );

      }


      if(
        !database.objectStoreNames.contains(
          IMAGE_STORE
        )
      ){

        database.createObjectStore(
          IMAGE_STORE,
          {
            keyPath:"productId"
          }
        );

      }

    };


    request.onsuccess = function(event){

      db = event.target.result;

      resolve(db);

    };


    request.onerror = function(){

      reject(
        request.error ||
        new Error(
          "تعذر فتح قاعدة بيانات المتجر."
        )
      );

    };

  });

}


/* =========================================================
   قراءة كل المنتجات من IndexedDB
========================================================= */

async function getAllProductsFromDB(){

  const database =
    await openDatabase();


  return new Promise((resolve,reject)=>{

    const transaction =
      database.transaction(
        PRODUCT_STORE,
        "readonly"
      );


    const store =
      transaction.objectStore(
        PRODUCT_STORE
      );


    const request =
      store.getAll();


    request.onsuccess = function(){

      resolve(
        Array.isArray(request.result)
          ? request.result
          : []
      );

    };


    request.onerror = function(){

      reject(request.error);

    };

  });

}


/* =========================================================
   قراءة صورة المنتج
========================================================= */

async function getProductImage(productId){

  const database =
    await openDatabase();


  return new Promise((resolve,reject)=>{

    const transaction =
      database.transaction(
        IMAGE_STORE,
        "readonly"
      );


    const store =
      transaction.objectStore(
        IMAGE_STORE
      );


    const request =
      store.get(productId);


    request.onsuccess = function(){

      if(
        request.result &&
        request.result.blob
      ){

        const url =
          URL.createObjectURL(
            request.result.blob
          );

        resolve(url);

      }else{

        resolve("");

      }

    };


    request.onerror = function(){

      reject(request.error);

    };

  });

}


/* =========================================================
   قراءة الإعدادات
========================================================= */

function loadSettings(){

  try{

    const saved =
      localStorage.getItem(
        "nexo_settings"
      );


    if(saved){

      settings =
        JSON.parse(saved);

    }

  }catch(error){

    console.error(
      "Settings error:",
      error
    );

  }


  if(!settings){

    settings = {

      storeName:"NEXO STORE",

      storeDescription:
        "متجر إلكتروني",

      currency:"ر.س",

      primary:"#6c4cff",

      secondary:"#171326"

    };

  }


  applySettings();

}


/* =========================================================
   تطبيق إعدادات المتجر
========================================================= */

function applySettings(){

  const storeName =
    settings.storeName ||
    "NEXO STORE";


  const description =
    settings.storeDescription ||
    "متجر إلكتروني";


  const currency =
    settings.currency ||
    "ر.س";


  document.getElementById(
    "storeName"
  ).textContent = storeName;


  document.getElementById(
    "heroTitle"
  ).textContent = storeName;


  document.getElementById(
    "heroDescription"
  ).textContent = description;


  document.getElementById(
    "currencyHeader"
  ).textContent = currency;


  document.getElementById(
    "footerStoreName"
  ).textContent = storeName;


  document.getElementById(
    "footerDescription"
  ).textContent = description;


  document.documentElement.style
    .setProperty(
      "--primary",
      settings.primary ||
      "#6c4cff"
    );


  document.documentElement.style
    .setProperty(
      "--secondary",
      settings.secondary ||
      "#171326"
    );

}


/* =========================================================
   تنسيق السعر
========================================================= */

function money(value){

  return Number(
    value || 0
  ).toLocaleString(
    "ar-SA"
  )
  + " "
  +
  (
    settings.currency ||
    "ر.س"
  );

}


/* =========================================================
   حماية النص
========================================================= */

function safe(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   تحميل المنتجات
========================================================= */

async function loadProducts(){

  const container =
    document.getElementById(
      "productsContainer"
    );


  container.innerHTML = `
    <div class="loading">
      جاري تحميل المنتجات...
    </div>
  `;


  try{

    products =
      await getAllProductsFromDB();


    /*
     * ترتيب المنتجات من الأحدث إلى الأقدم
     */

    products.sort(
      (a,b)=>
        new Date(
          b.createdAt || 0
        )
        -
        new Date(
          a.createdAt || 0
        )
    );


    filteredProducts =
      [...products];


    await renderProducts();


  }catch(error){

    console.error(
      "Products loading error:",
      error
    );


    /*
     * محاولة احتياطية من localStorage
     */

    try{

      const saved =
        localStorage.getItem(
          "nexo_products"
        );


      if(saved){

        products =
          JSON.parse(saved);

        filteredProducts =
          [...products];

        await renderProducts();

        return;

      }

    }catch(e){}


    container.innerHTML = `
      <div class="empty">
        حدث خطأ أثناء تحميل المنتجات.
      </div>
    `;

  }

}


/* =========================================================
   عرض المنتجات
========================================================= */

async function renderProducts(){

  const container =
    document.getElementById(
      "productsContainer"
    );


  if(!filteredProducts.length){

    container.innerHTML = `
      <div class="empty">

        <div style="font-size:45px;margin-bottom:15px">
          📦
        </div>

        لا توجد منتجات حالياً.

      </div>
    `;

    return;

  }


  container.innerHTML = `
    <div class="products-grid"
         id="productsGrid">
    </div>
  `;


  const grid =
    document.getElementById(
      "productsGrid"
    );


  for(
    const product of filteredProducts
  ){

    const card =
      document.createElement(
        "article"
      );


    card.className =
      "product-card";


    /*
     * الصورة
     */

    let imageUrl = "";


    try{

      imageUrl =
        await getProductImage(
          product.id
        );

    }catch(error){

      console.error(
        "Image error:",
        error
      );

    }


    let imageHTML;


    if(imageUrl){

      imageHTML = `
        <img
          class="product-image"
          src="${imageUrl}"
          alt="${safe(product.name)}"
          loading="lazy"
        >
      `;

    }else{

      /*
       * دعم الصور القديمة
       */

      if(
        product.image &&
        (
          product.image.startsWith(
            "data:image"
          )
          ||
          product.image.startsWith(
            "http"
          )
        )
      ){

        imageHTML = `
          <img
            class="product-image"
            src="${safe(product.image)}"
            alt="${safe(product.name)}"
            loading="lazy"
          >
        `;

      }else{

        imageHTML = `
          <div class="no-image">
            📦
          </div>
        `;

      }

    }


    const description =
      product.description ||
      "لا يوجد وصف للمنتج.";


    const stockText =
      product.type === "digital"
        ? "متوفر"
        : (
          Number(product.quantity || 0) > 0
            ? "متوفر"
            : "غير متوفر"
        );


    const disabled =
      product.type !== "digital" &&
      Number(product.quantity || 0) <= 0;


    card.innerHTML = `

      ${imageHTML}

      <div class="product-body">

        <div class="product-name">
          ${safe(product.name)}
        </div>

        <div class="product-description">
          ${safe(description)}
        </div>

        <div
          style="
            margin-top:10px;
            font-size:13px;
            color:#777;
          "
        >
          ${stockText}
        </div>

        <div class="product-bottom">

          <div class="product-price">
            ${money(product.price)}
          </div>

          <button
            class="buy-btn"
            ${disabled ? "disabled" : ""}
          >
            ${disabled ? "نفد المخزون" : "عرض المنتج"}
          </button>

        </div>

      </div>

    `;


    const button =
      card.querySelector(
        ".buy-btn"
      );


    if(!disabled){

      button.addEventListener(
        "click",
        function(){

          openProduct(product);

        }
      );

    }


    grid.appendChild(card);

  }

}


/* =========================================================
   البحث
========================================================= */

async function filterProducts(){

  const search =
    document.getElementById(
      "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


  if(!search){

    filteredProducts =
      [...products];

  }else{

    filteredProducts =
      products.filter(
        product => {

          const name =
            String(
              product.name || ""
            )
            .toLowerCase();


          const description =
            String(
              product.description || ""
            )
            .toLowerCase();


          return (
            name.includes(search)
            ||
            description.includes(search)
          );

        }
      );

  }


  await renderProducts();

}


/* =========================================================
   فتح المنتج
========================================================= */

async function openProduct(product){

  selectedProduct =
    product;


  document.getElementById(
    "modalName"
  ).textContent =
    product.name || "المنتج";


  document.getElementById(
    "modalDescription"
  ).textContent =
    product.description ||
    "لا يوجد وصف للمنتج.";


  document.getElementById(
    "modalPrice"
  ).textContent =
    money(product.price);


  const image =
    document.getElementById(
      "modalImage"
    );


  image.classList.add(
    "hidden"
  );


  image.src = "";


  try{

    const imageUrl =
      await getProductImage(
        product.id
      );


    if(imageUrl){

      image.src =
        imageUrl;

      image.classList.remove(
        "hidden"
      );

    }else if(
      product.image &&
      (
        product.image.startsWith(
          "data:image"
        )
        ||
        product.image.startsWith(
          "http"
        )
      )
    ){

      image.src =
        product.image;

      image.classList.remove(
        "hidden"
      );

    }

  }catch(error){

    console.error(
      "Modal image error:",
      error
    );

  }


  document.getElementById(
    "productModal"
  )
  .classList.remove(
    "hidden"
  );

}


/* =========================================================
   إغلاق النافذة
========================================================= */

function closeModal(event){

  if(
    event &&
    event.target &&
    event.target.id !==
      "productModal"
  ){

    return;

  }


  document.getElementById(
    "productModal"
  )
  .classList.add(
    "hidden"
  );


  selectedProduct =
    null;

}


/* =========================================================
   طلب المنتج
========================================================= */

function buyProduct(){

  if(!selectedProduct){

    return;

  }


  const name =
    document.getElementById(
      "customerName"
    ).value.trim();


  const phone =
    document.getElementById(
      "customerPhone"
    ).value.trim();


  if(!name){

    alert(
      "اكتب اسمك أولاً."
    );

    return;

  }


  if(!phone){

    alert(
      "اكتب رقم الجوال."
    );

    return;

  }


  /*
   * إذا كان المتجر لديه واتساب
   * يتم فتح واتساب مباشرة.
   */

  if(settings.whatsapp){

    let whatsapp =
      settings.whatsapp
      .replace(
        /[^0-9]/g,
        ""
      );


    if(
      whatsapp.startsWith("05")
    ){

      whatsapp =
        "966" +
        whatsapp.substring(1);

    }


    const message =
      `السلام عليكم، أريد طلب المنتج:

المنتج: ${selectedProduct.name}

السعر: ${money(selectedProduct.price)}

اسم العميل: ${name}

رقم الجوال: ${phone}`;


    const url =
      "https://wa.me/" +
      whatsapp +
      "?text=" +
      encodeURIComponent(
        message
      );


    window.open(
      url,
      "_blank"
    );

  }else{

    alert(
      "تم تسجيل طلب المنتج. يرجى التواصل مع المتجر."
    );

  }

}


/* =========================================================
   تشغيل الموقع
========================================================= */

async function init(){

  try{

    loadSettings();

    await openDatabase();

    await loadProducts();

  }catch(error){

    console.error(
      "Initialization error:",
      error
    );


    document.getElementById(
      "productsContainer"
    ).innerHTML = `
      <div class="empty">

        تعذر تشغيل قاعدة بيانات المتجر.

        <br><br>

        تأكد أن صفحة المتجر ولوحة الإدارة
        تعملان على نفس الموقع.

      </div>
    `;

  }

}


init();


/* =========================================================
   تحديث تلقائي عند الرجوع للصفحة
========================================================= */

window.addEventListener(
  "focus",
  async function(){

    try{

      loadSettings();

      await loadProducts();

    }catch(error){

      console.error(error);

    }

  }
);


/* =========================================================
   تحديث عند العودة للصفحة
========================================================= */

document.addEventListener(
  "visibilitychange",
  async function(){

    if(
      document.visibilityState ===
      "visible"
    ){

      try{

        await loadProducts();

      }catch(error){

        console.error(error);

      }

    }

  }
);

</script>
