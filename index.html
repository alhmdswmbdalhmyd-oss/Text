<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXO STORE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#111827;
  --accent:#2563eb;
  --accent2:#60a5fa;
  --green:#16a34a;
  --red:#dc2626;
  --bg:#f6f7f9;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --shadow:0 14px 40px rgba(17,24,39,.09);
  --glow:0 0 25px rgba(37,99,235,.16);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  font-family:"Cairo",sans-serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(37,99,235,.035),transparent 28%),
    radial-gradient(circle at 90% 30%,rgba(96,165,250,.035),transparent 28%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.loader-screen{
  position:fixed;
  inset:0;
  background:#fff;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.5s ease;
}

.loader-box{text-align:center;width:90%;max-width:350px}

.loader-logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:2px;
  animation:logoPulse 1.5s ease-in-out infinite;
}

.loader-logo span{color:var(--accent)}

.loader-line{
  height:5px;
  width:100%;
  background:#e5e7eb;
  border-radius:50px;
  overflow:hidden;
  margin-top:20px;
}

.loader-line div{
  width:0;
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  animation:loading 1.5s ease forwards;
}

@keyframes loading{to{width:100%}}
@keyframes logoPulse{50%{transform:scale(1.035)}}

header{
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  width:min(1200px,94%);
  margin:auto;
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:900;
  white-space:nowrap;
  transition:.25s
}

.logo span{color:var(--accent)}
.logo:hover{transform:translateY(-1px)}

.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.header-btn{
  border:1px solid var(--line);
  background:#fff;
  min-height:43px;
  padding:0 15px;
  border-radius:13px;
  font-weight:700;
  color:var(--text);
  transition:.25s ease;
}

.header-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
  box-shadow:var(--glow);
  transform:translateY(-2px);
}

.cart-btn{
  position:relative;
  display:flex;
  align-items:center;
  gap:7px;
}

.cart-badge{
  min-width:21px;
  height:21px;
  padding:0 5px;
  border-radius:50px;
  background:linear-gradient(135deg,#ef4444,#dc2626);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
}

.hero{
  width:min(1200px,94%);
  margin:25px auto 20px;
  background:
    radial-gradient(circle at 85% 15%,rgba(96,165,250,.22),transparent 25%),
    linear-gradient(135deg,#111827,#1e40af);
  color:#fff;
  border-radius:28px;
  padding:45px 35px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

.hero h1{
  font-size:clamp(28px,5vw,48px);
  font-weight:900;
  line-height:1.2;
  margin-bottom:10px;
}

.hero p{
  color:#dbeafe;
  font-size:16px;
  max-width:700px;
  line-height:2;
}

.container{
  width:min(1200px,94%);
  margin:auto
}

.search-box{
  display:flex;
  gap:10px;
  margin:25px 0 15px;
}

.search-box input{
  flex:1;
  height:50px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
  padding:0 17px;
  outline:none;
  font-size:14px;
  transition:.25s;
}

.search-box input:focus{
  border-color:var(--accent);
  box-shadow:var(--glow);
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 0 15px;
}

.category-btn{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#fff;
  padding:10px 17px;
  border-radius:12px;
  font-weight:700;
  transition:.25s;
}

.category-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
  transform:translateY(-2px);
}

.category-btn.active{
  background:linear-gradient(135deg,var(--primary),#26344d);
  color:#fff;
  border-color:var(--primary);
  box-shadow:0 7px 18px rgba(17,24,39,.15);
}

.section-title{
  font-size:24px;
  font-weight:900;
  margin:10px 0 18px;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px;
  padding-bottom:40px;
}

@media(max-width:900px){
  .products-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:550px){
  .products-grid{grid-template-columns:1fr;}
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:21px;
  overflow:hidden;
  transition:.3s ease;
  box-shadow:0 4px 15px rgba(0,0,0,.03);
  cursor:pointer;
}

.card:hover{
  transform:translateY(-7px);
  box-shadow:var(--shadow),var(--glow);
  border-color:rgba(37,99,235,.18);
}

.pic{
  height:240px;
  background:#f8fafc;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  border-bottom:1px solid var(--line);
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.card-body{padding:16px}

.card-name{
  font-size:17px;
  font-weight:900;
  margin-bottom:7px;
}

.card-price{
  font-size:20px;
  font-weight:900;
  color:var(--accent);
  margin-bottom:10px;
}

.card-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:12px;
}

.type-badge{
  background:#eff6ff;
  color:#1d4ed8;
  border-radius:9px;
  padding:5px 8px;
  font-size:11px;
  font-weight:800;
}

.available{
  color:var(--green);
  font-size:12px;
  font-weight:800;
}

.add-btn{
  width:100%;
  height:45px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,var(--primary),#26344d);
  color:#fff;
  font-weight:800;
  transition:.25s ease;
}

.add-btn:hover{
  background:linear-gradient(135deg,var(--accent),#1d4ed8);
  transform:translateY(-2px);
}

.empty{
  background:#fff;
  border:1px dashed #d1d5db;
  padding:40px;
  text-align:center;
  border-radius:20px;
  color:var(--muted);
  grid-column:1/-1;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(4px);
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.open{display:flex}

.modal-box{
  background:#fff;
  width:min(650px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:25px;
  padding:22px;
}

.product-modal-box{width:min(950px,100%)}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-title{font-size:22px;font-weight:900}

.close-btn{
  width:40px;
  height:40px;
  border:0;
  background:#f3f4f6;
  border-radius:12px;
  font-size:18px;
}

.product-details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}
@media(max-width:700px){.product-details{grid-template-columns:1fr;}}

.product-detail-image{
  min-height:350px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.product-detail-image img{width:100%;height:100%;object-fit:contain;}

.detail-price{
  color:var(--accent);
  font-size:27px;
  font-weight:900;
  margin:12px 0;
}

.description-box{
  margin-top:20px;
  padding:15px;
  background:#f8fafc;
  border-radius:15px;
  border:1px solid var(--line);
}
.description-box p{color:#4b5563;line-height:2;white-space:pre-wrap;}

.detail-add{
  margin-top:22px;
  width:100%;
  height:52px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,var(--primary),#26344d);
  color:#fff;
  font-size:16px;
  font-weight:900;
}

.cart-items{display:flex;flex-direction:column;gap:10px;}
.cart-item{
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.cart-summary{
  margin-top:18px;
  border-top:1px solid var(--line);
  padding-top:17px;
}
.summary-total{font-size:20px;font-weight:900;color:var(--accent);margin-bottom:12px;}

.checkout-btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,var(--green),#15803d);
  color:#fff;
  font-size:16px;
  font-weight:900;
}

footer{
  background:#111827;
  color:#fff;
  margin-top:40px;
  padding:35px 0;
  text-align:center;
}
.footer-text{color:#9ca3af;font-size:13px;}
</style>
</head>

<body>

<div class="loader-screen" id="loader">
  <div class="loader-box">
    <div class="loader-logo">NEXO <span>STORE</span></div>
    <div class="loader-line"><div></div></div>
  </div>
</div>

<header>
  <div class="header-inner">
    <a href="#" class="logo">NEXO <span>STORE</span></a>
    <div class="header-actions">
      <button class="header-btn cart-btn" type="button" onclick="openCart()">
        🛒 السلة <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1>NEXO STORE</h1>
    <p>متجرك الإلكتروني السحابي المتكامل لمزامنة وعرض المنتجات والصور فوراً عبر جميع الأجهزة.</p>
  </div>
</section>

<main class="container">
  <div class="search-box">
    <input id="searchInput" type="search" placeholder="ابحث عن منتج..." oninput="renderProducts()">
  </div>

  <div class="categories">
    <button class="category-btn active" type="button" onclick="setCategory('all',this)">الكل</button>
    <button class="category-btn" type="button" onclick="setCategory('digital',this)">المنتجات الرقمية</button>
    <button class="category-btn" type="button" onclick="setCategory('physical',this)">المنتجات المتنوعة</button>
  </div>

  <h2 class="section-title">المنتجات الحية</h2>
  <div class="products-grid" id="productsGrid"></div>
</main>

<footer>
  <div class="container">
    <div class="footer-text">جميع الحقوق محفوظة © NEXO STORE <span id="footerYear"></span></div>
  </div>
</footer>

<div class="modal" id="productModal" onclick="modalOutside(event,'productModal')">
  <div class="modal-box product-modal-box">
    <div class="modal-head">
      <div class="modal-title">تفاصيل المنتج</div>
      <button class="close-btn" type="button" onclick="closeProduct()">✕</button>
    </div>
    <div id="productDetails"></div>
  </div>
</div>

<div class="modal" id="cartModal" onclick="modalOutside(event,'cartModal')">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">🛒 سلة المشتريات</div>
      <button class="close-btn" type="button" onclick="closeCart()">✕</button>
    </div>
    <div id="cartItems"></div>
  </div>
</div>

<!-- الاتصال المباشر والحقيقي بقاعدة بيانات مشروعك في Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD-YourActualApiKeyHere", // استبدلها بالمفتاح الحقيقي من لوحة تحكم فايربيس
    authDomain: "nexo-store-484a1.firebaseapp.com",
    projectId: "nexo-store-484a1",
    storageBucket: "nexo-store-484a1.appspot.com",
    messagingSenderId: "371233680861",
    appId: "1:371233680861:web:56b9..."
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.initFirebaseSync = function() {
    const q = query(collection(db, "products"));
    onSnapshot(q, (snapshot) => {
      let firebaseProducts = [];
      snapshot.forEach((docSnap) => {
        let p = docSnap.data();
        firebaseProducts.push({
          id: docSnap.id,
          name: p.name || "منتج بدون اسم",
          price: p.price || 0,
          image: p.image || "",
          description: p.description || "لا يوجد وصف متاح لهذا المنتج.",
          type: p.type || "physical"
        });
      });
      products = firebaseProducts;
      renderProducts();
    }, (error) => {
      console.error("خطأ في مزامنة البيانات مع Firebase: ", error);
    });
  };
</script>

<script>
let products = [];
let cart = [];
let currentCategory = "all";
const PLACEHOLDER = "https://via.placeholder.com/700x500?text=NEXO+STORE";

function money(val){ return Number(val || 0).toFixed(2); }
function escapeHtml(str){ return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function init(){
  cart = JSON.parse(localStorage.getItem("nexo_cart") || "[]");
  updateCartCount();
  
  if(window.initFirebaseSync) window.initFirebaseSync();

  document.getElementById("footerYear").textContent = new Date().getFullYear();
  setTimeout(()=>{
    const loader = document.getElementById("loader");
    if(loader) loader.style.display = "none";
  }, 900);
}

function setCategory(cat, btn){
  currentCategory = cat;
  document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  renderProducts();
}

function renderProducts(){
  const grid = document.getElementById("productsGrid");
  const search = document.getElementById("searchInput").value.trim().toLowerCase();

  const filtered = products.filter(p => {
    const matchCat = currentCategory === "all" || p.type === currentCategory;
    const matchSearch = !search || p.name.toLowerCase().includes(search);
    return matchCat && matchSearch;
  });

  if(!filtered.length){
    grid.innerHTML = `<div class="empty">لا توجد منتجات حالياً. أضف منتجاتك داخل مجموعة <b>products</b> في قاعدة بيانات Firestore لتظهر وتتزامن فوراً بين الهواتف.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <article class="card" onclick="openProduct('${p.id}')">
      <div class="pic">
        <img src="${escapeHtml(p.image || PLACEHOLDER)}" alt="${escapeHtml(p.name)}" onerror="this.src='${PLACEHOLDER}'">
      </div>
      <div class="card-body">
        <div class="card-name">${escapeHtml(p.name)}</div>
        <div class="card-price">${money(p.price)} ر.س</div>
        <div class="card-meta">
          <span class="type-badge">${p.type === 'digital' ? 'رقمي' : 'متنوع'}</span>
          <span class="available">متوفر</span>
        </div>
        <button class="add-btn" type="button" onclick="event.stopPropagation();addToCart('${p.id}')">🛒 أضف للسلة</button>
      </div>
    </article>
  `).join("");
}

function openProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  
  document.getElementById("productDetails").innerHTML = `
    <div class="product-details">
      <div class="product-detail-image">
        <img src="${escapeHtml(p.image || PLACEHOLDER)}" alt="${escapeHtml(p.name)}" onerror="this.src='${PLACEHOLDER}'">
      </div>
      <div>
        <h2>${escapeHtml(p.name)}</h2>
        <div class="detail-price">${money(p.price)} ر.س</div>
        <div class="description-box">
          <h3>وصف المنتج</h3>
          <p>${escapeHtml(p.description)}</p>
        </div>
        <button class="detail-add" type="button" onclick="addToCart('${p.id}');closeProduct();">🛒 أضف المنتج إلى السلة</button>
      </div>
    </div>
  `;
  document.getElementById("productModal").classList.add("open");
}

function closeProduct(){ document.getElementById("productModal").classList.remove("open"); }

function addToCart(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  const item = cart.find(x => x.id === id);
  if(item) item.quantity++;
  else cart.push({id, quantity: 1});

  localStorage.setItem("nexo_cart", JSON.stringify(cart));
  updateCartCount();
  alert("تمت الإضافة إلى السلة بنجاح");
}

function updateCartCount(){
  const count = cart.reduce((sum, i) => sum + i.quantity, 0);
  document.getElementById("cartCount").textContent = count;
}

function openCart(){
  const box = document.getElementById("cartItems");
  if(!cart.length){
    box.innerHTML = `<div class="empty">السلة فارغة حالياً.</div>`;
  } else {
    let subtotal = 0;
    box.innerHTML = `<div class="cart-items">` + cart.map(i => {
      const p = products.find(x => x.id === i.id);
      if(!p) return "";
      subtotal += p.price * i.quantity;
      return `<div class="cart-item">
        <div>
          <div style="font-weight:900">${escapeHtml(p.name)}</div>
          <div style="color:var(--accent);font-size:13px">${money(p.price)} ر.س × ${i.quantity}</div>
        </div>
      </div>`;
    }).join("") + `</div><div class="cart-summary"><div class="summary-total">المجموع: ${money(subtotal)} ر.س</div><button class="checkout-btn" type="button" onclick="alert('تم إتمام الطلب بنجاح!')">إتمام الطلب</button></div>`;
  }
  document.getElementById("cartModal").classList.add("open");
}

function closeCart(){ document.getElementById("cartModal").classList.remove("open"); }
function modalOutside(e, id){ if(e.target.id === id) document.getElementById(id).classList.remove("open"); }

init();
</script>

</body>
</html>
