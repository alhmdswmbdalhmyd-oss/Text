<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXO STORE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Moyasar -->
<link rel="stylesheet"
href="https://cdn.moyasar.com/mpf/1.14.0/moyasar.css">

<style>
:root{
    --ink:#111827;
    --muted:#6b7280;
    --line:#e9edf2;
    --soft:#f7f9fc;
    --green:#16a34a;
    --red:#dc2626;
    --radius:22px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Cairo,Arial,sans-serif;
    background:#fff;
    color:var(--ink);
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
}

/* LOADER */

#loader{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.5s;
}

.loader-box{
    text-align:center;
    width:min(360px,86vw);
}

.loader-logo{
    font-size:34px;
    font-weight:800;
    letter-spacing:1px;
}

.loader-line{
    height:3px;
    background:#eef0f3;
    border-radius:9px;
    overflow:hidden;
    margin-top:22px;
}

.loader-line span{
    display:block;
    width:0;
    height:100%;
    background:#111;
    animation:load 1.8s ease forwards;
}

@keyframes load{
    to{
        width:100%;
    }
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
}

.nav{
    max-width:1250px;
    margin:auto;
    padding:14px 22px;
    display:flex;
    align-items:center;
    gap:18px;
}

.brand{
    font-size:23px;
    font-weight:800;
    margin-left:auto;
}

.nav-actions{
    display:flex;
    gap:8px;
    align-items:center;
}

.nav-btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:13px;
    padding:10px 13px;
    position:relative;
}

.nav-btn:hover{
    background:#f7f8fa;
}

.badge{
    position:absolute;
    top:-7px;
    left:-7px;
    min-width:21px;
    height:21px;
    border-radius:50%;
    background:#111;
    color:#fff;
    font-size:11px;
    display:grid;
    place-items:center;
    padding:0 5px;
}

/* HERO */

.hero{
    max-width:1250px;
    margin:24px auto 0;
    padding:0 22px;
}

.hero-card{
    min-height:480px;
    border:1px solid var(--line);
    border-radius:32px;
    background:
        radial-gradient(
            circle at 20% 20%,
            #fff,
            #f6f8fb 60%,
            #eef1f5
        );
    display:grid;
    place-items:center;
    text-align:center;
    padding:50px 20px;
    overflow:hidden;
    position:relative;
}

.hero-card:after{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    border:1px solid #fff;
    box-shadow:
        0 0 0 35px rgba(255,255,255,.5),
        0 0 0 70px rgba(255,255,255,.35);
}

.hero-content{
    position:relative;
    z-index:1;
}

.eyebrow{
    font-size:13px;
    color:var(--muted);
    letter-spacing:2px;
}

.hero h1{
    font-size:clamp(42px,8vw,82px);
    margin:10px 0;
    font-weight:800;
}

.hero p{
    color:var(--muted);
    max-width:560px;
    margin:0 auto 25px;
    line-height:2;
}

/* BUTTONS */

.primary{
    background:#111;
    color:#fff;
    border:0;
    border-radius:14px;
    padding:13px 22px;
    transition:.2s;
}

.primary:hover{
    transform:translateY(-1px);
    background:#000;
}

.primary:disabled{
    opacity:.5;
}

.ghost{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 18px;
}

/* PRODUCTS */

.container{
    max-width:1250px;
    margin:65px auto;
    padding:0 22px;
}

.top-row{
    display:flex;
    gap:15px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
}

.search{
    min-width:min(360px,100%);
    flex:1;
    max-width:460px;
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 16px;
    outline:none;
}

.search:focus{
    border-color:#111;
}

.tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:22px 0;
}

.tab{
    border:1px solid var(--line);
    background:#fff;
    border-radius:12px;
    padding:10px 16px;
}

.tab.active{
    background:#111;
    color:#fff;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(230px,1fr));
    gap:18px;
}

.card{
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    background:#fff;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:
        0 12px 30px rgba(17,24,39,.08);
}

.pic{
    height:230px;
    background:#f5f6f8;
    display:grid;
    place-items:center;
    overflow:hidden;
}

.pic img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card-body{
    padding:17px;
}

.card h3{
    margin:0 0 7px;
}

.desc{
    font-size:13px;
    color:var(--muted);
    line-height:1.8;
    min-height:45px;
}

.price{
    font-size:20px;
    font-weight:800;
    margin:13px 0;
}

.stock{
    font-size:12px;
    color:#b45309;
    margin-bottom:8px;
}

/* TRACK */

.track-section{
    margin-top:65px;
}

.track-box{
    border:1px solid var(--line);
    background:var(--soft);
    border-radius:25px;
    padding:25px;
}

.track-form{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

.track-form input{
    flex:1;
    min-width:220px;
    border:1px solid var(--line);
    border-radius:13px;
    padding:13px;
    background:#fff;
}

.result{
    margin-top:18px;
}

.status-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
}

.status-pill{
    display:inline-block;
    padding:7px 12px;
    border-radius:99px;
    background:#f0f2f5;
    font-weight:700;
    font-size:13px;
    margin:8px 0;
}

/* FOOTER */

footer{
    border-top:1px solid var(--line);
    margin-top:80px;
    padding:35px 22px;
    text-align:center;
    color:var(--muted);
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.42);
    z-index:500;
    display:none;
    align-items:flex-end;
    justify-content:center;
}

.modal.open{
    display:flex;
}

.sheet{
    width:min(720px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:28px 28px 0 0;
    padding:24px;
}

.sheet-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close{
    border:0;
    background:#f2f3f5;
    border-radius:12px;
    padding:8px 12px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
}

.qty button{
    border:1px solid var(--line);
    background:#fff;
    border-radius:9px;
    width:30px;
    height:30px;
}

.totals{
    margin-top:18px;
    background:var(--soft);
    border-radius:16px;
    padding:15px;
}

.row{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
}

/* CHECKOUT */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
    margin-top:15px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field.full{
    grid-column:1/-1;
}

.field input,
.field textarea,
.field select{
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    outline:none;
    background:#fff;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#111;
}

.method{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:9px;
}

.method label{
    border:1px solid var(--line);
    border-radius:13px;
    padding:13px;
    cursor:pointer;
    transition:.2s;
}

.method label:hover{
    border-color:#111;
}

.method input{
    accent-color:#111;
}

.payment-box{
    margin-top:15px;
    padding:15px;
    border:1px solid var(--line);
    border-radius:16px;
    background:#fafafa;
}

.payment-title{
    font-weight:700;
    margin-bottom:10px;
}

.payment-logo{
    font-weight:800;
    font-size:18px;
    margin-bottom:8px;
}

.notice{
    padding:12px;
    border-radius:13px;
    background:#f6f7f9;
    color:#4b5563;
    font-size:13px;
    line-height:1.8;
    margin-top:12px;
}

.success-icon{
    width:75px;
    height:75px;
    margin:auto;
    border-radius:50%;
    background:#ecfdf5;
    color:var(--green);
    display:grid;
    place-items:center;
    font-size:40px;
    font-weight:800;
}

.order-number{
    font-size:28px;
    font-weight:800;
    direction:ltr;
}

/* MOBILE */

@media(max-width:650px){

    .nav{
        padding:12px 14px;
    }

    .brand{
        font-size:19px;
    }

    .hero{
        padding:0 12px;
    }

    .hero-card{
        min-height:430px;
        border-radius:25px;
    }

    .container{
        padding:0 14px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .method{
        grid-template-columns:1fr;
    }

    .nav-btn span{
        display:none;
    }

    .order-number{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div id="loader">
    <div class="loader-box">
        <div class="loader-logo">
            NEXO STORE
        </div>

        <div class="loader-line">
            <span></span>
        </div>
    </div>
</div>

<header>

    <div class="nav">

        <div class="brand">
            NEXO STORE
        </div>

        <div class="nav-actions">

            <button
                class="nav-btn"
                onclick="openTrack()"
            >
                استعلام الطلب
            </button>

            <button
                class="nav-btn"
                onclick="openCart()"
            >
                السلة 🛒

                <b
                    class="badge"
                    id="cartCount"
                >
                    0
                </b>
            </button>

        </div>

    </div>

</header>

<section class="hero">

    <div class="hero-card">

        <div class="hero-content">

            <div class="eyebrow">
                WELCOME TO NEXO
            </div>

            <h1>
                كل ما تحتاجه، في مكان واحد.
            </h1>

            <p id="heroText">
                تسوق بسهولة، ادفع بأمان،
                وتابع طلبك حتى يصل إليك.
            </p>

            <button
                class="primary"
                onclick="
                document
                .getElementById('products')
                .scrollIntoView()
                "
            >
                ابدأ التسوق
            </button>

        </div>

    </div>

</section>

<main
    class="container"
    id="products"
>

    <div class="top-row">

        <div>

            <h2 style="margin:0">
                المنتجات
            </h2>

            <small style="color:#6b7280">
                اختَر ما يناسبك
            </small>

        </div>

        <input
            class="search"
            id="search"
            placeholder="ابحث عن منتج..."
            oninput="renderProducts()"
        >

    </div>

    <div class="tabs">

        <button
            class="tab active"
            onclick="setCat('all',this)"
        >
            الكل
        </button>

        <button
            class="tab"
            onclick="setCat('digital',this)"
        >
            المنتجات الرقمية
        </button>

        <button
            class="tab"
            onclick="setCat('physical',this)"
        >
            المنتجات المتنوعة
        </button>

    </div>

    <div
        class="grid"
        id="productsGrid"
    ></div>

    <section
        class="track-section"
        id="track"
    >

        <h2>
            الاستعلام عن الطلب
        </h2>

        <div class="track-box">

            <p style="color:#6b7280">
                اكتب رقم طلبك لمشاهدة آخر حالة.
            </p>

            <div class="track-form">

                <input
                    id="trackNumber"
                    placeholder="مثال: NEXO-12345678"
                >

                <button
                    class="primary"
                    onclick="trackOrder()"
                >
                    عرض الحالة
                </button>

            </div>

            <div
                class="result"
                id="trackResult"
            ></div>

        </div>

    </section>

</main>

<footer id="footer"></footer>

<!-- CART -->

<div
    class="modal"
    id="cartModal"
>

    <div class="sheet">

        <div class="sheet-head">

            <h2>
                سلة المشتريات
            </h2>

            <button
                class="close"
                onclick="closeCart()"
            >
                إغلاق
            </button>

        </div>

        <div id="cartItems"></div>

        <div id="cartCheckout"></div>

    </div>

</div>

<!-- CHECKOUT -->

<div
    class="modal"
    id="checkoutModal"
>

    <div class="sheet">

        <div class="sheet-head">

            <h2>
                إتمام الطلب
            </h2>

            <button
                class="close"
                onclick="closeCheckout()"
            >
                إغلاق
            </button>

        </div>

        <div id="checkoutBody"></div>

    </div>

</div>

<!-- MOYASAR -->

<script src="https://cdn.moyasar.com/mpf/1.14.0/moyasar.js"></script>

<!-- PAYPAL -->
<div id="paypalScriptContainer"></div>

<script>

const K = {

    products:"nexo_products",
    orders:"nexo_orders",
    settings:"nexo_settings",
    cart:"nexo_cart"

};

let products =
JSON.parse(
    localStorage.getItem(K.products) || "[]"
);

let settings =
JSON.parse(
    localStorage.getItem(K.settings) || "{}"
);

let cart =
JSON.parse(
    localStorage.getItem(K.cart) || "[]"
);

let category = "all";

let currentOrderData = null;

const statusMap = {

    new:[
        "🟡",
        "جديد",
        "تم استلام طلبك."
    ],

    processing:[
        "🔵",
        "قيد التجهيز",
        "جاري تجهيز طلبك الآن."
    ],

    out:[
        "🟠",
        "خرج للتوصيل",
        "طلبك في الطريق إليك."
    ],

    delivered:[
        "🟢",
        "تم التسليم",
        "تم تسليم طلبك بنجاح."
    ],

    cancelled:[
        "🔴",
        "ملغي",
        "تم إلغاء هذا الطلب."
    ]

};

function saveCart(){

    localStorage.setItem(
        K.cart,
        JSON.stringify(cart)
    );

    updateCartCount();

}

function saveProducts(){

    localStorage.setItem(
        K.products,
        JSON.stringify(products)
    );

}

function money(number){

    return Number(number || 0)
        .toFixed(2)
        .replace(".00","")
        + " ر.س";

}

function discountFor(subtotal){

    const tiers =
        settings.wholesaleTiers ||
        [
            {min:5,percent:5},
            {min:10,percent:10},
            {min:20,percent:15}
        ];

    const quantity =
        cart.reduce(
            (total,item)=>
                total + Number(item.qty || 0),
            0
        );

    let percent = 0;

    tiers.forEach(tier=>{

        if(
            quantity >= Number(tier.min)
        ){

            percent =
                Math.max(
                    percent,
                    Number(tier.percent)
                );

        }

    });

    return {

        percent,

        value:
            subtotal * percent / 100

    };

}

function updateCartCount(){

    document.getElementById(
        "cartCount"
    ).textContent =
        cart.reduce(
            (total,item)=>
                total + Number(item.qty || 0),
            0
        );

}

function setCat(cat,button){

    category = cat;

    document
        .querySelectorAll(".tab")
        .forEach(
            item =>
                item.classList.remove("active")
        );

    button.classList.add("active");

    renderProducts();

}

function escapeHtml(value){

    return String(value)
        .replace(
            /[&<>"']/g,
            character =>
            ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"
            })[character]
        );

}

function renderProducts(){

    const search =
        (
            document.getElementById(
                "search"
            ).value || ""
        ).toLowerCase();

    const list =
        products.filter(product =>

            (
                category === "all" ||
                product.type === category
            )

            &&

            (
                (product.name || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (product.description || "")
                    .toLowerCase()
                    .includes(search)
            )

        );

    const grid =
        document.getElementById(
            "productsGrid"
        );

    if(!list.length){

        grid.innerHTML = `
            <div
                style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:55px;
                    color:#777
                "
            >
                لا توجد منتجات حاليًا.
            </div>
        `;

        return;

    }

    grid.innerHTML =
        list.map(product => {

            const out =
                product.type === "physical" &&
                Number(product.quantity) <= 0;

            const low =
                product.type === "physical" &&
                Number(product.quantity) > 0 &&
                Number(product.quantity) <= 3;

            return `

            <article class="card">

                <div class="pic">

                    ${
                        product.image
                        ?
                        `
                        <img
                            src="${escapeHtml(product.image)}"
                            alt=""
                        >
                        `
                        :
                        `
                        <span style="color:#9ca3af">
                            NEXO
                        </span>
                        `
                    }

                </div>

                <div class="card-body">

                    <h3>
                        ${escapeHtml(product.name || "منتج")}
                    </h3>

                    <div class="desc">
                        ${escapeHtml(product.description || "")}
                    </div>

                    ${
                        low
                        ?
                        `
                        <div class="stock">
                            متبقي قليل
                        </div>
                        `
                        :
                        ""
                    }

                    ${
                        out
                        ?
                        `
                        <div
                            class="stock"
                            style="color:#b91c1c"
                        >
                            نفد من المخزون
                        </div>
                        `
                        :
                        ""
                    }

                    <div class="price">
                        ${money(product.price)}
                    </div>

                    <button
                        class="primary"
                        style="width:100%"
                        ${out ? "disabled" : ""}
                        onclick="addToCart('${product.id}')"
                    >
                        ${
                            out
                            ?
                            "نفد المخزون"
                            :
                            "أضف للسلة"
                        }
                    </button>

                </div>

            </article>

            `;

        }).join("");

}

function addToCart(id){

    const product =
        products.find(
            item =>
                String(item.id) === String(id)
        );

    if(!product){
        return;
    }

    const item =
        cart.find(
            item =>
                String(item.id) === String(id)
        );

    if(
        product.type === "physical" &&
        Number(product.quantity)
        <= Number(item?.qty || 0)
    ){

        alert(
            "الكمية المتاحة غير كافية"
        );

        return;

    }

    if(item){
        item.qty++;
    }
    else{
        cart.push({
            id:product.id,
            qty:1
        });
    }

    saveCart();

    openCart();

}

function removeItem(id){

    cart =
        cart.filter(
            item =>
                String(item.id)
                !== String(id)
        );

    saveCart();

    renderCart();

}

function changeQty(id,difference){

    const item =
        cart.find(
            item =>
                String(item.id)
                === String(id)
        );

    if(!item){
        return;
    }

    const product =
        products.find(
            item =>
                String(item.id)
                === String(id)
        );

    let quantity =
        Number(item.qty)
        + difference;

    if(quantity <= 0){

        removeItem(id);

        return;

    }

    if(
        product.type === "physical" &&
        quantity >
        Number(product.quantity)
    ){

        return;

    }

    item.qty = quantity;

    saveCart();

    renderCart();

}

function cartSummary(){

    let subtotal = 0;

    cart.forEach(item=>{

        const product =
            products.find(
                product =>
                    String(product.id)
                    === String(item.id)
            );

        if(product){

            subtotal +=
                Number(product.price)
                * Number(item.qty);

        }

    });

    const discount =
        discountFor(subtotal);

    const hasPhysical =
        cart.some(item=>{

            const product =
                products.find(
                    product =>
                        String(product.id)
                        === String(item.id)
                );

            return product?.type === "physical";

        });

    const delivery =
        hasPhysical
        ?
        Number(settings.deliveryFee || 0)
        :
        0;

    return {

        subtotal,

        discount:
            discount.value,

        percent:
            discount.percent,

        delivery,

        total:
            Math.max(
                0,
                subtotal -
                discount.value +
                delivery
            )

    };

}

        document.getElementById(

        document.getElementById(

        ).value.trim();

    if(!name || !phone || !email){

        alert(

        );

    }

    if(
        fulfillment === "delivery" &&
        !address
    ){

        alert(
            "اكتب عنوان التوصيل داخل مكة."
        );

        return null;

    }

    return {

        phone,

function generateOrderNo(){

    return (
        "NEXO-" +
        Math.floor(
            10000000 +
            Math.random() * 90000000
        )
    );

}

function buildOrder(customer,payment){

    const summary =
        cartSummary();

    const orderNumber =
        generateOrderNo();

    return {

        id:Date.now(),

        orderNumber,

        customerName:
            customer.name,

        phone:
            customer.phone,

        email:
            customer.email,

        address:
            customer.address,

        fulfillment:
            customer.fulfillment,

        paymentMethod:
            payment,

        paymentStatus:
            payment === "cash"
            ?
            "pending"
            :
            "paid",

        items:
            cart.map(item=>{

                const product =
                    products.find(
                        product =>
                            String(product.id)
                            === String(item.id)
                    );

                return {

                    id:product.id,

                    name:product.name,

                    price:
                        Number(product.price),

                    quantity:
                        Number(item.qty),

                    type:
                        product.type,

                    digitalLink:
                        product.digitalLink || ""

                };

            }),

        subtotal:
            summary.subtotal,

        discount:
            summary.discount,

        discountPercent:
            summary.percent,

        delivery:
            summary.delivery,

        total:
            summary.total,

        status:
            "new",

        createdAt:
            new Date().toISOString()

    };

}

function saveCompletedOrder(order){

    const orders =
        JSON.parse(
            localStorage.getItem(
                K.orders
            ) || "[]"
        );

    orders.push(order);

    localStorage.setItem(
        K.orders,
        JSON.stringify(orders)
    );

    cart.forEach(item=>{

        const product =
            products.find(
                product =>
                    String(product.id)
                    === String(item.id)
            );

        if(
            product &&
            product.type === "physical"
        ){

            product.quantity =
                Math.max(
                    0,
                    Number(product.quantity)
                    -
                    Number(item.qty)
                );

        }

    });

    saveProducts();

    cart = [];

    saveCart();

    closeCheckout();

    showOrderSuccess(order);

}

function startMoyasarPayment(){

    const customer =
        getCustomerData();

    if(!customer){
        return;
    }

    const summary =
        cartSummary();

    const publishableKey =
        settings.moyasarPublishableKey ||
        "";

    if(!publishableKey){

        alert(
            "لم يتم وضع مفتاح Moyasar من لوحة الإدارة."
        );

        return;

    }

    currentOrderData = {
        customer,
        summary
    };

    const form =
        document.getElementById(
            "moyasar-form"
        );

    form.innerHTML = "";

    Moyasar.init({

        element:
            ".mysr-form",

        amount:
            Math.round(
                summary.total * 100
            ),

        currency:
            "SAR",

        description:
            "NEXO STORE Order",

        publishable_api_key:
            publishableKey,

        callback_url:
            window.location.href,

        methods:[
            "creditcard"
        ],

        on_completed:
            function(payment){

                handleMoyasarSuccess(
                    payment
                );

            },

        on_failure:
            function(error){

                console.error(
                    error
                );

                alert(
                    "فشلت عملية الدفع. لم يتم إنشاء الطلب."
                );

            }

    });

}

function handleMoyasarSuccess(payment){

    if(!currentOrderData){
        return;
    }

    /*
       مهم:
       في النسخة الإنتاجية يجب إرسال
       payment.id إلى السيرفر والتحقق من:
       amount + currency + status
       قبل إنشاء الطلب.
    */

    const order =
        buildOrder(
            currentOrderData.customer,
            "moyasar"
        );

    order.paymentId =
        payment?.id || "";

    order.paymentStatus =
        payment?.status || "paid";

    saveCompletedOrder(order);

    currentOrderData = null;

}

/* PAYPAL */

function loadPayPal(){

    const clientId =
        settings.paypalClientId ||
        "";

    if(!clientId){

        document.getElementById(
            "paypal-button-container"
        ).innerHTML = `

            <div class="notice">

                لم يتم إعداد PayPal بعد.
                ضع PayPal Client ID من لوحة الإدارة.

            </div>

        `;

        return;

    }

    if(
        window.paypal
    ){

        renderPayPalButtons();

        return;

    }

    const old =
        document.getElementById(
            "paypal-sdk"
        );

    if(old){
        old.remove();
    }

    const script =
        document.createElement(
            "script"
        );

    script.id =
        "paypal-sdk";

    script.src =
        "https://www.paypal.com/sdk/js?client-id="
        +
        encodeURIComponent(clientId)
        +
        "&currency=USD";

    script.onload =
        function(){

            renderPayPalButtons();

        };

    script.onerror =
        function(){

            alert(
                "تعذر تحميل PayPal."
            );

        };

    document
        .getElementById(
            "paypalScriptContainer"
        )
        .appendChild(script);

}

function renderPayPalButtons(){

    const container =
        document.getElementById(
            "paypal-button-container"
        );

    if(!container || !window.paypal){
        return;
    }

    container.innerHTML = "";

    paypal.Buttons({

        createOrder:
            async function(){

                const customer =
                    getCustomerData();

                if(!customer){
                    throw new Error(
                        "بيانات العميل ناقصة"
                    );
                }

                const summary =
                    cartSummary();

                currentOrderData = {
                    customer,
                    summary
                };

                /*
                  هذا المسار يحتاج Backend حقيقي:
                  /api/paypal/create-order

                  السيرفر هو الذي ينشئ
                  PayPal Order ويحافظ على
                  Client Secret.
                */

                const response =
                    await fetch(
                        "/api/paypal/create-order",
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    amount:
                                        summary.total,

                                    currency:
                                        "SAR"

                                })

                        }
                    );

                if(!response.ok){

                    throw new Error(
                        "تعذر إنشاء عملية PayPal"
                    );

                }

                const data =
                    await response.json();

                return data.id;

            },

        onApprove:
            async function(data){

                /*
                  السيرفر يقوم بعملية capture
                  والتحقق من نجاح الدفع.
                */

                const response =
                    await fetch(
                        "/api/paypal/capture-order",
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    orderID:
                                        data.orderID

                                })

                        }
                    );

                if(!response.ok){

                    throw new Error(
                        "فشل تأكيد الدفع"
                    );

                }

                const result =
                    await response.json();

                if(
                    result.status !==
                    "COMPLETED"
                ){

                    alert(
                        "لم يتم تأكيد الدفع."
                    );

                    return;

                }

                const order =
                    buildOrder(
                        currentOrderData.customer,
                        "paypal"
                    );

                order.paypalOrderId =
                    data.orderID;

                order.paymentStatus =
                    "paid";

                saveCompletedOrder(
                    order
                );

                currentOrderData =
                    null;

            },

        onError:
            function(error){

                console.error(
                    error
                );

                alert(
                    "حدث خطأ أثناء الدفع بواسطة PayPal."
                );

            }

    }).render(
        "#paypal-button-container"
    );

}

        "footer"

            settings.contact

            escapeHtml(settings.contact)

        }`;

    renderProducts();

    updateCartCount();

    setTimeout(()=>{

        document.getElementById(
            "loader"
        ).style.opacity = "0";

        setTimeout(()=>{

            const loader =
                document.getElementById(
                    "loader"
                );

            if(loader){
                loader.remove();
            }

        },500);

    },1900);

}

init();

</script>
