<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXO STORE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#111827;
  --accent:#2563eb;
  --accent2:#60a5fa;
  --green:#16a34a;
  --red:#dc2626;
  --bg:#f6f7f9;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --shadow:0 14px 40px rgba(17,24,39,.09);
  --glow:0 0 25px rgba(37,99,235,.16);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  font-family:"Cairo",sans-serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(37,99,235,.035),transparent 28%),
    radial-gradient(circle at 90% 30%,rgba(96,165,250,.035),transparent 28%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

header{
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  width:min(1200px,94%);
  margin:auto;
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{font-size:25px;font-weight:900;white-space:nowrap}
.logo span{color:var(--accent)}

.header-actions{display:flex;align-items:center;gap:9px}

.header-btn{
  border:1px solid var(--line);
  background:#fff;
  min-height:43px;
  padding:0 15px;
  border-radius:13px;
  font-weight:700;
  color:var(--text);
  transition:.25s ease;
}

.header-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
  box-shadow:var(--glow);
  transform:translateY(-2px);
}

.cart-btn{position:relative;display:flex;align-items:center;gap:7px}

.cart-badge{
  min-width:21px;
  height:21px;
  padding:0 5px;
  border-radius:50px;
  background:linear-gradient(135deg,#ef4444,#dc2626);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
}

.whatsapp-float{
  position:fixed;
  left:18px;
  bottom:18px;
  z-index:450;
  height:54px;
  padding:0 20px;
  border-radius:50px;
  background:linear-gradient(135deg,#16a34a,#15803d);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-size:14px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(0,0,0,.20);
}

.hero{
  width:min(1200px,94%);
  margin:25px auto 20px;
  background:linear-gradient(135deg,#111827,#1e40af);
  color:#fff;
  border-radius:28px;
  padding:45px 35px;
  box-shadow:var(--shadow);
}

.hero h1{font-size:clamp(28px,5vw,48px);font-weight:900;margin-bottom:10px}
.hero p{color:#dbeafe;font-size:16px;max-width:700px;line-height:2}

.container{width:min(1200px,94%);margin:auto}

.search-box{display:flex;gap:10px;margin:25px 0 15px}
.search-box input{
  flex:1;height:50px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 17px;outline:none;font-size:14px;
}
.search-box input:focus{border-color:var(--accent);box-shadow:var(--glow)}

.categories{display:flex;gap:8px;overflow-x:auto;padding:5px 0 15px}
.category-btn{
  white-space:nowrap;border:1px solid var(--line);background:#fff;padding:10px 17px;border-radius:12px;font-weight:700;
}
.category-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.section-title{font-size:24px;font-weight:900;margin:10px 0 18px}

.products-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;padding-bottom:40px}

.card{
  background:#fff;border:1px solid var(--line);border-radius:21px;overflow:hidden;transition:.3s ease;box-shadow:0 4px 15px rgba(0,0,0,.03);cursor:pointer;
}
.card:hover{transform:translateY(-7px);box-shadow:var(--shadow),var(--glow)}

.pic{height:240px;background:#f8fafc;display:flex;align-items:center;justify-content:center;padding:15px;border-bottom:1px solid var(--line)}
.pic img{width:100%;height:100%;object-fit:contain}

.card-body{padding:16px}
.card-name{font-size:17px;font-weight:900;margin-bottom:7px}
.card-price{font-size:20px;font-weight:900;color:var(--accent);margin-bottom:10px}

.add-btn{
  width:100%;height:45px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-weight:800;transition:.25s;
}
.add-btn:hover{background:var(--accent)}

.empty{background:#fff;border:1px dashed #d1d5db;padding:40px;text-align:center;border-radius:20px;color:var(--muted);grid-column:1/-1}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.58);backdrop-filter:blur(4px);z-index:500;display:none;align-items:center;justify-content:center;padding:15px;
}
.modal.open{display:flex}
.modal-box{background:#fff;width:min(650px,100%);max-height:92vh;overflow:auto;border-radius:25px;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.25)}
.product-modal-box{width:min(950px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:22px;font-weight:900}
.close-btn{width:40px;height:40px;border:0;background:#f3f4f6;border-radius:12px;font-size:18px}

.product-details{display:grid;grid-template-columns:1fr 1fr;gap:25px}
.product-detail-image{min-height:420px;background:#f8fafc;border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;align-items:center;justify-content:center}
.product-detail-image img{width:100%;height:100%;max-height:520px;object-fit:contain}
.detail-price{color:var(--accent);font-size:27px;font-weight:900;margin:12px 0}
.description-box{margin-top:20px;padding:15px;background:#f8fafc;border-radius:15px;border:1px solid var(--line)}

.cart-item{border:1px solid var(--line);border-radius:15px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cart-item-img{width:65px;height:65px;background:#f8fafc;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:6px}
.cart-item-img img{width:100%;height:100%;object-fit:contain}
.remove-btn{color:var(--red);border:0;background:transparent;font-size:12px;font-weight:800}

.checkout-btn{
  width:100%;height:50px;border:0;border-radius:14px;background:var(--primary);color:#fff;font-weight:900;margin-top:15px;
}
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:800}
.form-group input{width:100%;border:1px solid var(--line);border-radius:12px;min-height:46px;padding:10px 13px;outline:none}

footer{background:#111827;color:#fff;margin-top:40px;padding:35px 0;text-align:center}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <a href="#" class="logo">NEXO <span>STORE</span></a>
    <div class="header-actions">
      <button class="header-btn" type="button" onclick="openTrack()">🔎 استعلام الطلب</button>
      <button class="header-btn cart-btn" type="button" onclick="openCart()">
        🛒 السلة
        <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<a class="whatsapp-float" href="https://wa.me/966501203710" target="_blank">💬 تواصل معنا</a>

<section class="hero">
  <div class="container">
    <h1>NEXO STORE</h1>
    <p>متجرك الإلكتروني للمنتجات الرقمية والمنتجات المتنوعة.</p>
  </div>
</section>

<main class="container">
  <div class="search-box">
    <input id="searchInput" type="search" placeholder="ابحث عن منتج..." oninput="renderProducts()">
  </div>

  <div class="categories">
    <button class="category-btn active" type="button" onclick="setCategory('all',this)">الكل</button>
    <button class="category-btn" type="button" onclick="setCategory('digital',this)">المنتجات الرقمية</button>
    <button class="category-btn" type="button" onclick="setCategory('physical',this)">المنتجات المتنوعة</button>
  </div>

  <h2 class="section-title">المنتجات</h2>
  <div class="products-grid" id="productsGrid"></div>
</main>

<footer>
  <p>جميع الحقوق محفوظة © NEXO STORE</p>
</footer>

<!-- Modals -->
<div class="modal" id="productModal" onclick="modalOutside(event,'productModal')">
  <div class="modal-box product-modal-box">
    <div class="modal-head">
      <div class="modal-title">تفاصيل المنتج</div>
      <button class="close-btn" type="button" onclick="closeProduct()">✕</button>
    </div>
    <div id="productDetails"></div>
  </div>
</div>

<div class="modal" id="cartModal" onclick="modalOutside(event,'cartModal')">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">🛒 سلة المشتريات</div>
      <button class="close-btn" type="button" onclick="closeCart()">✕</button>
    </div>
    <div id="cartItems"></div>
  </div>
</div>

<div class="modal" id="trackModal" onclick="modalOutside(event,'trackModal')">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">🔎 استعلام الطلب</div>
      <button class="close-btn" type="button" onclick="closeTrack()">✕</button>
    </div>
    <div class="form-group">
      <label>رقم الطلب</label>
      <input id="trackNumber" placeholder="مثال: NEXO-12345678">
    </div>
    <button class="checkout-btn" type="button" onclick="trackOrder()">استعلام</button>
    <div id="trackResult" style="margin-top:15px"></div>
  </div>
</div>

<script>
const K = { products:"nexo_products", orders:"nexo_orders", cart:"nexo_cart" };
let products = [];
let orders = [];
let cart = [];
let currentCategory = "all";

function loadData(){
  try {
    products = JSON.parse(localStorage.getItem(K.products)) || [];
    orders = JSON.parse(localStorage.getItem(K.orders)) || [];
    cart = JSON.parse(localStorage.getItem(K.cart)) || [];
  } catch(e) {}
}

function money(val){ return Number(val||0).toFixed(2); }

function renderProducts(){
  loadData();
  const grid = document.getElementById("productsGrid");
  const search = document.getElementById("searchInput").value.trim().toLowerCase();

  const filtered = products.filter(p => {
    const name = String(p.name || "").toLowerCase();
    const type = p.type || "physical";
    let catMatch = (currentCategory === "all") || (currentCategory === type);
    let searchMatch = !search || name.includes(search);
    return catMatch && searchMatch;
  });

  if(!filtered.length){
    grid.innerHTML = `<div class="empty">لا توجد منتجات حالياً.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <article class="card" onclick="openProduct('${p.id}')">
      <div class="pic"><img src="${p.image}" alt="منتج"></div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-price">${money(p.price)} ر.س</div>
        <button class="add-btn" type="button" onclick="event.stopPropagation();addToCart('${p.id}')">🛒 أضف للسلة</button>
      </div>
    </article>
  `).join("");
}

function setCategory(cat, btn){
  currentCategory = cat;
  document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderProducts();
}

function openProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  document.getElementById("productDetails").innerHTML = `
    <div class="product-details">
      <div class="product-detail-image"><img src="${p.image}"></div>
      <div>
        <h2>${p.name}</h2>
        <div class="detail-price">${money(p.price)} ر.س</div>
        <div class="description-box"><p>${p.description || "لا يوجد وصف"}</p></div>
        <button class="checkout-btn" type="button" onclick="addToCart('${p.id}');closeProduct();">🛒 أضف للسلة</button>
      </div>
    </div>
  `;
  document.getElementById("productModal").classList.add("open");
}
function closeProduct(){ document.getElementById("productModal").classList.remove("open"); }

function addToCart(id){
  const item = cart.find(x => x.id === id);
  if(item) item.quantity++;
  else cart.push({id, quantity:1});
  localStorage.setItem(K.cart, JSON.stringify(cart));
  updateCartCount();
  alert("تمت الإضافة للسلة!");
}

function updateCartCount(){
  const count = cart.reduce((sum,i)=> sum + i.quantity, 0);
  document.getElementById("cartCount").textContent = count;
}

function openCart(){
  const box = document.getElementById("cartItems");
  if(!cart.length){ box.innerHTML = `<div class="empty">السلة فارغة.</div>`; }
  else {
    box.innerHTML = cart.map(i => {
      const p = products.find(x => x.id === i.id);
      if(!p) return "";
      return `<div class="cart-item">
        <div class="cart-item-img"><img src="${p.image}"></div>
        <div style="flex:1"><b>${p.name}</b><br>${money(p.price)} ر.س (الكمية: ${i.quantity})</div>
        <button class="remove-btn" onclick="removeFromCart('${i.id}')">حذف</button>
      </div>`;
    }).join("");
  }
  document.getElementById("cartModal").classList.add("open");
}
function closeCart(){ document.getElementById("cartModal").classList.remove("open"); }

function removeFromCart(id){
  cart = cart.filter(x => x.id !== id);
  localStorage.setItem(K.cart, JSON.stringify(cart));
  updateCartCount();
  openCart();
}

function openTrack(){ document.getElementById("trackModal").classList.add("open"); }
function closeTrack(){ document.getElementById("trackModal").classList.remove("open"); }
function trackOrder(){
  const num = document.getElementById("trackNumber").value.trim();
  const found = orders.find(o => o.orderNumber === num);
  document.getElementById("trackResult").innerHTML = found ? `<div style="background:#f0fdf4;padding:12px;border-radius:10px;">الطلب موجود وإجمالي المبلغ: ${money(found.total)} ر.س</div>` : `<div style="color:red">لم يتم العثور على الطلب.</div>`;
}
function modalOutside(e,id){ if(e.target.id === id) document.getElementById(id).classList.remove("open"); }

loadData();
renderProducts();
updateCartCount();
</script>
</body>
</html>
