<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXO STORE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:"Cairo",Arial,sans-serif;
  background:#f7f8fa;
  color:#171717;
}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOADER */
#loader{
  position:fixed;
  inset:0;
  background:#fff;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:18px;
}
.loader-logo{
  font-size:32px;
  font-weight:800;
  letter-spacing:1px;
}
.loader-line{
  width:220px;
  height:4px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
}
.loader-line span{
  display:block;
  width:45%;
  height:100%;
  background:#111;
  border-radius:20px;
  animation:load 1.2s infinite ease-in-out;
}
@keyframes load{
  0%{transform:translateX(-150%)}
  100%{transform:translateX(350%)}
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #eee;
}
.header-inner{
  max-width:1250px;
  margin:auto;
  min-height:72px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}
.logo{
  font-size:24px;
  font-weight:800;
  color:#111;
  white-space:nowrap;
}
.logo span{font-weight:500;color:#777}
.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
}
.icon-btn{
  position:relative;
  border:1px solid #e7e7e7;
  background:#fff;
  width:44px;
  height:44px;
  border-radius:13px;
  font-size:19px;
}
.cart-count{
  position:absolute;
  top:-5px;
  left:-5px;
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:50px;
  background:#111;
  color:#fff;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* HERO */
.hero{
  max-width:1250px;
  margin:22px auto 0;
  padding:0 18px;
}
.hero-box{
  min-height:310px;
  border-radius:28px;
  background:linear-gradient(135deg,#111 0%,#242424 55%,#444 100%);
  color:#fff;
  padding:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
  overflow:hidden;
}
.hero-content{max-width:700px}
.hero-small{
  color:#ccc;
  font-size:14px;
  margin-bottom:8px;
}
.hero h1{
  margin:0 0 12px;
  font-size:44px;
  line-height:1.25;
}
.hero p{
  color:#ddd;
  line-height:2;
  margin:0 0 25px;
}
.hero-btn{
  border:0;
  background:#fff;
  color:#111;
  padding:13px 24px;
  border-radius:13px;
  font-weight:700;
  font-size:15px;
}
.hero-decoration{
  width:230px;
  height:230px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.hero-decoration div{
  width:145px;
  height:145px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  letter-spacing:2px;
}

/* MAIN */
.container{
  max-width:1250px;
  margin:0 auto;
  padding:30px 18px 60px;
}
.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}
.section-title h2{
  margin:0;
  font-size:25px;
}
.search-box{
  display:flex;
  align-items:center;
  background:#fff;
  border:1px solid #e6e6e6;
  border-radius:15px;
  overflow:hidden;
  max-width:430px;
  width:100%;
}
.search-box input{
  width:100%;
  border:0;
  outline:0;
  padding:13px 15px;
  background:transparent;
}
.search-box span{padding:0 13px;color:#888}

/* CATEGORIES */
.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:3px 0 18px;
}
.categories::-webkit-scrollbar{display:none}
.category{
  white-space:nowrap;
  border:1px solid #ddd;
  background:#fff;
  color:#555;
  border-radius:50px;
  padding:9px 17px;
  font-size:13px;
}
.category.active{
  background:#111;
  border-color:#111;
  color:#fff;
}

/* PRODUCTS */
.products-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
.product-card{
  background:#fff;
  border:1px solid #e9e9e9;
  border-radius:19px;
  overflow:hidden;
  transition:.2s;
}
.product-card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 35px rgba(0,0,0,.07);
}
.product-image{
  width:100%;
  aspect-ratio:1/1;
  background:#f3f3f3;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.no-image{
  color:#aaa;
  font-size:14px;
}
.product-info{padding:15px}
.product-type{
  font-size:11px;
  color:#888;
  margin-bottom:5px;
}
.product-name{
  font-size:16px;
  font-weight:700;
  margin-bottom:7px;
  min-height:28px;
}
.product-desc{
  color:#777;
  font-size:12px;
  line-height:1.8;
  min-height:43px;
}
.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:13px;
}
.price{
  font-weight:800;
  font-size:17px;
}
.currency{
  font-size:11px;
  color:#777;
}
.add-btn{
  border:0;
  background:#111;
  color:#fff;
  border-radius:11px;
  padding:9px 13px;
  font-size:12px;
  font-weight:700;
}
.out{
  color:#c62828;
  font-size:12px;
  margin-top:8px;
}

/* EMPTY */
.empty{
  background:#fff;
  border:1px dashed #ddd;
  border-radius:18px;
  padding:45px 20px;
  text-align:center;
  color:#888;
  grid-column:1/-1;
}

/* DRAWER */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:3000;
}
.drawer{
  position:fixed;
  top:0;
  right:-480px;
  width:min(460px,100%);
  height:100vh;
  background:#fff;
  z-index:3100;
  transition:.3s;
  display:flex;
  flex-direction:column;
  box-shadow:-10px 0 40px rgba(0,0,0,.15);
}
.drawer.open{right:0}
.drawer-head{
  padding:18px;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.drawer-head h3{margin:0}
.close{
  border:0;
  background:#f2f2f2;
  width:38px;
  height:38px;
  border-radius:10px;
}
.drawer-body{
  padding:16px;
  overflow:auto;
  flex:1;
}
.cart-item{
  border:1px solid #eee;
  border-radius:15px;
  padding:11px;
  display:flex;
  gap:11px;
  margin-bottom:10px;
}
.cart-item img{
  width:72px;
  height:72px;
  border-radius:11px;
  object-fit:cover;
  background:#f2f2f2;
}
.cart-item-main{flex:1}
.cart-item-name{font-weight:700;font-size:14px}
.cart-item-price{font-size:12px;color:#777;margin-top:4px}
.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}
.qty button{
  border:1px solid #ddd;
  background:#fff;
  width:28px;
  height:28px;
  border-radius:8px;
}
.remove{
  border:0;
  background:none;
  color:#c62828;
  font-size:12px;
}
.drawer-footer{
  border-top:1px solid #eee;
  padding:16px;
}
.total-row{
  display:flex;
  justify-content:space-between;
  font-weight:800;
  margin-bottom:13px;
}
.primary{
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  padding:13px;
  border-radius:13px;
  font-weight:700;
}
.secondary{
  width:100%;
  border:1px solid #ddd;
  background:#fff;
  color:#111;
  padding:12px;
  border-radius:13px;
  font-weight:700;
  margin-top:8px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:5000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal-box{
  width:min(650px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  padding:20px;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}
.modal-head h3{margin:0}
.form-group{margin-bottom:13px}
.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}
.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #ddd;
  border-radius:11px;
  padding:12px;
  outline:0;
  background:#fff;
}
.form-group textarea{
  min-height:85px;
  resize:vertical;
}
.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.payment-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.payment-option{
  border:1px solid #ddd;
  border-radius:11px;
  padding:12px 6px;
  text-align:center;
  cursor:pointer;
  font-size:12px;
}
.payment-option.active{
  border-color:#111;
  background:#111;
  color:#fff;
}
.checkout-summary{
  background:#f7f7f7;
  border-radius:14px;
  padding:14px;
  margin:14px 0;
}
.summary-line{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  font-size:13px;
}
.summary-line.total{
  border-top:1px solid #ddd;
  margin-top:7px;
  padding-top:10px;
  font-weight:800;
  font-size:16px;
}

/* PRODUCT DETAILS */
.detail-image{
  width:100%;
  max-height:380px;
  object-fit:contain;
  background:#f5f5f5;
  border-radius:16px;
}
.detail-name{
  font-size:24px;
  font-weight:800;
  margin:15px 0 5px;
}
.detail-price{
  font-size:22px;
  font-weight:800;
}
.detail-description{
  line-height:2;
  color:#666;
  margin:15px 0;
}
.options-group{
  border:1px solid #eee;
  border-radius:13px;
  padding:12px;
  margin-bottom:10px;
}
.options-group-title{
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}
.option-values{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}
.option-value{
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  padding:8px 12px;
  font-size:12px;
}
.option-value.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

/* TRACK */
.track-box{text-align:center}
.track-input{
  display:flex;
  gap:8px;
  margin:15px 0;
}
.track-input input{
  flex:1;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  outline:0;
}
.track-input button{
  border:0;
  background:#111;
  color:#fff;
  border-radius:12px;
  padding:0 17px;
}
.track-result{
  background:#f7f7f7;
  border-radius:15px;
  padding:15px;
  text-align:right;
}
.status{
  display:inline-block;
  padding:7px 13px;
  border-radius:50px;
  background:#111;
  color:#fff;
  font-size:12px;
  margin:7px 0;
}

/* SUCCESS */
.success{
  text-align:center;
  padding:15px 5px;
}
.success-icon{
  width:70px;
  height:70px;
  background:#111;
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  margin:0 auto 15px;
}
.order-number{
  background:#f5f5f5;
  border-radius:12px;
  padding:12px;
  font-size:18px;
  font-weight:800;
  margin:15px 0;
}

/* FOOTER */
footer{
  background:#111;
  color:#fff;
  padding:35px 18px;
}
.footer-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:25px;
}
footer p{
  color:#aaa;
  font-size:13px;
  line-height:2;
  margin:5px 0;
}

/* TOAST */
#toast{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%) translateY(120px);
  background:#111;
  color:#fff;
  padding:12px 20px;
  border-radius:12px;
  z-index:9000;
  opacity:0;
  transition:.3s;
  font-size:13px;
}
#toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

/* RESPONSIVE */
@media(max-width:1000px){
  .products-grid{grid-template-columns:repeat(3,1fr)}
  .hero h1{font-size:36px}
}
@media(max-width:700px){
  .header-inner{min-height:64px}
  .logo{font-size:20px}
  .hero-box{
    padding:30px 23px;
    min-height:280px;
  }
  .hero h1{font-size:30px}
  .hero-decoration{display:none}
  .section-title{
    flex-direction:column;
    align-items:stretch;
  }
  .products-grid{grid-template-columns:repeat(2,1fr);gap:11px}
  .product-info{padding:11px}
  .product-name{font-size:14px}
  .product-desc{font-size:11px}
  .price{font-size:15px}
  .add-btn{padding:8px 9px}
  .grid-2{grid-template-columns:1fr}
  .payment-options{grid-template-columns:1fr}
  .footer-inner{flex-direction:column}
}
@media(max-width:400px){
  .products-grid{grid-template-columns:1fr 1fr}
  .hero{padding:0 10px}
  .container{padding-left:10px;padding-right:10px}
  .hero-box{border-radius:20px}
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-logo">NEXO STORE</div>
  <div class="loader-line"><span></span></div>
  <div style="font-size:13px;color:#888">جاري تجهيز المتجر...</div>
</div>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="logo">NEXO <span>STORE</span></div>

    <div class="header-actions">
      <button class="icon-btn" onclick="openTrack()" title="استعلام الطلب">🔎</button>

      <button class="icon-btn" onclick="openCart()" title="السلة">
        🛒
        <span id="cartCount" class="cart-count">0</span>
      </button>
    </div>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-box">
    <div class="hero-content">
      <div class="hero-small">مرحبًا بك في</div>
      <h1 id="heroTitle">NEXO STORE</h1>
      <p id="heroDescription">
        متجر إلكتروني يوفر لك منتجات رقمية ومنتجات مختارة بطريقة بسيطة وسريعة.
      </p>
      <button class="hero-btn" onclick="document.getElementById('productsSection').scrollIntoView()">
        تسوق الآن
      </button>
    </div>

    <div class="hero-decoration">
      <div>NEXO</div>
    </div>
  </div>
</section>

<!-- PRODUCTS -->
<main class="container" id="productsSection">

  <div class="section-title">
    <h2>المنتجات</h2>

    <div class="search-box">
      <span>⌕</span>
      <input id="searchInput" type="search" placeholder="ابحث عن منتج..." oninput="renderProducts()">
    </div>
  </div>

  <div class="categories">
    <button class="category active" data-category="all" onclick="setCategory('all',this)">
      الكل
    </button>
    <button class="category" data-category="digital" onclick="setCategory('digital',this)">
      المنتجات الرقمية
    </button>
    <button class="category" data-category="physical" onclick="setCategory('physical',this)">
      المنتجات المتنوعة
    </button>
  </div>

  <div id="productsGrid" class="products-grid"></div>

</main>

<!-- FOOTER -->
<footer>
  <div class="footer-inner">
    <div>
      <div style="font-size:22px;font-weight:800">NEXO STORE</div>
      <p id="footerDescription">متجرك الإلكتروني.</p>
    </div>

    <div>
      <p>© <span id="year"></span> NEXO STORE</p>
      <p>جميع الحقوق محفوظة</p>
    </div>
  </div>
</footer>

<!-- OVERLAY -->
<div id="overlay" class="overlay hidden" onclick="closeAllPanels()"></div>

<!-- CART -->
<div id="cartDrawer" class="drawer">
  <div class="drawer-head">
    <h3>سلة المشتريات</h3>
    <button class="close" onclick="closeCart()">✕</button>
  </div>

  <div id="cartBody" class="drawer-body"></div>

  <div class="drawer-footer">
    <div class="total-row">
      <span>الإجمالي</span>
      <span id="cartTotal">0 ر.س</span>
    </div>

    <button class="primary" onclick="openCheckout()">
      إتمام الطلب
    </button>

    <button class="secondary" onclick="closeCart()">
      متابعة التسوق
    </button>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  push,
  set
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAdwWU0-_YbvA1Tb1Oeiwi5IqLieQcn_Lk",
  authDomain: "nexo-store-484a1.firebaseapp.com",
  databaseURL: "https://nexo-store-484a1-default-rtdb.firebaseio.com",
  projectId: "nexo-store-484a1",
  storageBucket: "nexo-store-484a1.firebasestorage.app",
  messagingSenderId: "371233680861",
  appId: "1:371233680861:web:5a89c056964bbe99861a34",
  measurementId: "G-FNGFYN3VQ3"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);


/* =========================================================
   KEYS
========================================================= */

const K = {
  products: "nexo_products",
  orders: "nexo_orders",
  settings: "nexo_settings",
  cart: "nexo_cart"
};


/* =========================================================
   STATE
========================================================= */

let products = [];
let orders = [];
let cart = [];
let settings = {};

let currentCategory = "all";
let currentDetailProduct = null;
let selectedOptions = {};

let selectedPayment = "cash";


/* =========================================================
   HELPERS
========================================================= */

function getJSON(key, fallback){
  try{
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  }catch(e){
    return fallback;
  }
}

function saveJSON(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
  }catch(e){
    console.error(e);
  }
}

function money(value){
  return Number(value || 0).toLocaleString("ar-SA") + " ر.س";
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showToast(message){
  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    toast.classList.remove("show");
  },2500);
}

function normalizeProduct(p){
  return {
    id:p?.id ?? "",
    name:p?.name ?? "منتج",
    type:p?.type ?? "physical",
    price:Number(p?.price ?? 0),
    cost:Number(p?.cost ?? 0),
    quantity:Number(p?.quantity ?? 0),
    low:Number(p?.low ?? 0),
    digitalLink:p?.digitalLink ?? "",
    description:p?.description ?? "",
    image:p?.image ?? "",
    options:Array.isArray(p?.options) ? p.options : [],
    createdAt:p?.createdAt ?? "",
    updatedAt:p?.updatedAt ?? ""
  };
}


/* =========================================================
   INITIAL LOAD
========================================================= */

function loadLocalData(){

  products = getJSON(K.products,[]);
  orders = getJSON(K.orders,[]);
  cart = getJSON(K.cart,[]);
  settings = getJSON(K.settings,{});

  if(!Array.isArray(products)) products=[];
  if(!Array.isArray(orders)) orders=[];
  if(!Array.isArray(cart)) cart=[];

  products = products.map(normalizeProduct);

  applySettings();
  updateCartCount();
  renderProducts();
  renderCart();
}


/* =========================================================
   SETTINGS
========================================================= */

function applySettings(){

  const storeName =
    settings.storeName ||
    "NEXO STORE";

  const description =
    settings.description ||
    settings.storeDescription ||
    "متجر إلكتروني يوفر لك منتجات رقمية ومنتجات مختارة بطريقة بسيطة وسريعة.";

  document.title = storeName;

  document.getElementById("heroTitle").textContent = storeName;

  document.getElementById("heroDescription").textContent =
    description;

  document.getElementById("footerDescription").textContent =
    description;

  document.getElementById("year").textContent =
    new Date().getFullYear();
}


/* =========================================================
   FIREBASE PRODUCTS
========================================================= */

function startFirebaseProducts(){

  const productsRef =
    ref(db,"nexo_store/products");

  onValue(
    productsRef,
    snapshot => {

      const data = snapshot.val();

      if(!data){
        products = [];
        saveJSON(K.products,products);
        renderProducts();
        return;
      }

      let firebaseProducts = [];

      if(Array.isArray(data)){
        firebaseProducts = data;
      }else if(typeof data === "object"){
        firebaseProducts = Object.values(data);
      }

      products =
        firebaseProducts
          .filter(Boolean)
          .map(normalizeProduct);

      saveJSON(K.products,products);

      renderProducts();
    },
    error => {
      console.error(
        "Firebase products error:",
        error
      );

      showToast("تعذر الاتصال بالمنتجات");
    }
  );
}


/* =========================================================
   FIREBASE SETTINGS
========================================================= */

function startFirebaseSettings(){

  const settingsRef =
    ref(db,"nexo_store/settings");

  onValue(
    settingsRef,
    snapshot => {

      const data = snapshot.val();

      if(data && typeof data === "object"){

        settings = {
          ...settings,
          ...data
        };

        saveJSON(K.settings,settings);

        applySettings();
      }
    },
    error => {
      console.error(
        "Firebase settings error:",
        error
      );
    }
  );
}

/* =========================================================
   PRODUCTS
========================================================= */

window.renderProducts = function(){

  const grid =
    document.getElementById("productsGrid");

  const search =
    document.getElementById("searchInput")
      ?.value
      ?.trim()
      ?.toLowerCase() || "";

  let list = [...products];

  if(currentCategory !== "all"){
    list =
      list.filter(
        p => p.type === currentCategory
      );
  }

  if(search){
    list =
      list.filter(p =>
        String(p.name)
          .toLowerCase()
          .includes(search) ||
        String(p.description)
          .toLowerCase()
          .includes(search)
      );
  }

  if(!list.length){

    grid.innerHTML = `
      <div class="empty">
        لا توجد منتجات متاحة حاليًا.
      </div>
    `;

    return;
  }

  grid.innerHTML =
    list.map(productCard).join("");
};


function productCard(product){

    Number(product.quantity) <= 0;

  const image =
    product.image
      ? `
        <img
          src="${escapeHTML(product.image)}"
          alt="${escapeHTML(product.name)}"
          loading="lazy"
          onerror="this.style.display='none'"
        >
      `
      : `
        <div class="no-image">
          لا توجد صورة
        </div>
      `;

  return `
    <article class="product-card">

      <div
        class="product-image"
        onclick="openProduct('${escapeHTML(product.id)}')"
        style="cursor:pointer"
      >
        ${image}
      </div>

      <div class="product-info">

        <div class="product-type">
          ${
            product.type === "digital"
              ? "منتج رقمي"
              : "منتج متنوع"
          }
        </div>

        <div
          class="product-name"
          onclick="openProduct('${escapeHTML(product.id)}')"
          style="cursor:pointer"
        >
          ${escapeHTML(product.name)}
        </div>

        <div class="product-desc">
          ${escapeHTML(product.description || "منتج من NEXO STORE")}
        </div>

        <div class="product-bottom">

          <div class="price">
            ${money(product.price)}
          </div>

          ${
            outOfStock
            ?
            `<span style="font-size:11px;color:#c62828">
              غير متوفر
            </span>`
            :
            `
            <button
              class="add-btn"
              onclick="quickAdd('${escapeHTML(product.id)}')"
            >
              أضف للسلة
            </button>
            `
          }

        </div>

        ${
          outOfStock
          ?

          ""
        }

window.quickAdd = function(id){

  const product =
    products.find(
      p => String(p.id) === String(id)
    );

  if(!product) return;

  if(
    product.type !== "digital" &&
    Number(product.quantity) <= 0
  ){
    showToast("المنتج غير متوفر");
    return;
  }

  if(
    Array.isArray(product.options) &&
    product.options.length
  ){
    openProduct(id);
    return;
  }

  addToCart(product,1,{});
};


/* =========================================================
   WHOLESALE PRICE
========================================================= */

function getWholesaleDiscount(quantity){

  quantity = Number(quantity || 0);

  const tiers =
    settings.wholesaleTiers ||
    settings.wholesale ||
    {};

  const five =
    Number(
      tiers["5"] ??
      settings.wholesale5 ??
      5
    );

  const ten =
    Number(
      tiers["10"] ??
      settings.wholesale10 ??
      10
    );

  const twenty =
    Number(
      tiers["20"] ??
      settings.wholesale20 ??
      15
    );

  if(quantity >= 20) return twenty;
  if(quantity >= 10) return ten;
  if(quantity >= 5) return five;

  return 0;
}

function getItemPrice(product,quantity){

  const discount =
    getWholesaleDiscount(quantity);

  return Number(product.price || 0) *
    (1 - discount / 100);
}


/* =========================================================
   CART
========================================================= */

function optionKey(options){

  if(!options || typeof options !== "object"){
    return "";
  }

  return Object
    .keys(options)
    .sort()
    .map(key=>`${key}:${options[key]}`)
    .join("|");
}


function addToCart(product,quantity,options){

  quantity =
    Math.max(1,Number(quantity || 1));

  const key =
    String(product.id) + "::" +
    optionKey(options);

  const existing =
    cart.find(
      item => item.key === key
    );

  if(existing){

    existing.quantity += quantity;

  }else{

    cart.push({
      key,
      productId:product.id,
      name:product.name,
      price:Number(product.price || 0),
      image:product.image || "",
      type:product.type || "physical",
      quantity,
      options:options || {},
      digitalLink:product.digitalLink || ""
    });
  }

  saveJSON(K.cart,cart);

  updateCartCount();
  renderCart();

  showToast("تمت إضافة المنتج للسلة");
}


function getCartTotal(){

  return cart.reduce(
    (sum,item)=>{
      return sum +
        getItemPrice(
          {
            price:item.price
          },
          item.quantity
        ) * item.quantity;
    },
    0
  );
}


function getCartSubtotal(){

  return cart.reduce(
    (sum,item)=>{
      return sum +
        Number(item.price || 0) *
        item.quantity;
    },
    0
  );
}


function getDeliveryFee(){

  const physical =
    cart.some(
      item => item.type !== "digital"
    );

  if(!physical) return 0;

  return Number(
    settings.deliveryFee ??
    settings.shippingFee ??
    0
  );
}


function updateCartCount(){

  const count =
    cart.reduce(
      (sum,item)=>
        sum + Number(item.quantity || 0),
      0
    );

  document.getElementById("cartCount")
    .textContent = count;
}


function renderCart(){

  const body =
    document.getElementById("cartBody");

  if(!cart.length){

    body.innerHTML = `
      <div class="empty">
        السلة فارغة.
      </div>
    `;

    document.getElementById("cartTotal")
      .textContent = money(0);

    return;
  }

  body.innerHTML =
    cart.map((item,index)=>{

      const unitPrice =
        getItemPrice(
          {
            price:item.price
          },
          item.quantity
        );

      const image =
        item.image
          ?
          `<img src="${escapeHTML(item.image)}" alt="">`
          :
          `<div style="
            width:72px;
            height:72px;
            background:#f2f2f2;
            border-radius:11px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#aaa;
          ">NEXO</div>`;

      const options =
        item.options &&
        Object.keys(item.options).length
          ?
          `
          <div style="font-size:11px;color:#888;margin-top:3px">
            ${Object.values(item.options)
              .map(v=>escapeHTML(v))
              .join(" / ")}
          </div>
          `
          :
          "";

      return `
        <div class="cart-item">

          ${image}

          <div class="cart-item-main">

            <div class="cart-item-name">
              ${escapeHTML(item.name)}
            </div>

            ${options}

            <div class="cart-item-price">
              ${money(unitPrice)}
            </div>

            <div class="qty">

              <button
                onclick="changeCartQty(${index},-1)"
              >
                −
              </button>

              <strong>
                ${item.quantity}
              </strong>

              <button
                onclick="changeCartQty(${index},1)"
              >
                +
              </button>

              <button
                class="remove"
                onclick="removeCartItem(${index})"
              >
                حذف
              </button>

            </div>

          </div>

        </div>
      `;

    }).join("");

  document.getElementById("cartTotal")
    .textContent =
      money(
        getCartTotal() +
        getDeliveryFee()
      );
}


window.changeCartQty = function(index,delta){

  const item = cart[index];

  if(!item) return;

  const product =
    products.find(
      p => String(p.id) === String(item.productId)
    );

  const next =
    Number(item.quantity) + delta;

  if(next <= 0){
    cart.splice(index,1);
  }else{

    if(
      product &&
      product.type !== "digital" &&
      Number(product.quantity) > 0 &&
      next > Number(product.quantity)
    ){
      showToast("لا توجد كمية كافية");
      return;
    }

    item.quantity = next;
  }

  saveJSON(K.cart,cart);
  updateCartCount();
  renderCart();
};


window.removeCartItem = function(index){

  cart.splice(index,1);

  saveJSON(K.cart,cart);

  updateCartCount();
  renderCart();
};

/* =========================================================
   SUBMIT ORDER
========================================================= */

window.submitOrder = async function(){

  const name =
    document.getElementById("customerName")
      ?.value.trim();

  const phone =
    document.getElementById("customerPhone")
      ?.value.trim();

  const email =
    document.getElementById("customerEmail")
      ?.value.trim();

  const deliveryMethod =
    document.getElementById("deliveryMethod")
      ?.value || "delivery";

  const address =
    document.getElementById("customerAddress")
      ?.value.trim() || "";

  const note =
    document.getElementById("customerNote")
      ?.value.trim() || "";

  if(!name){
    showToast("اكتب اسمك");
    return;
  }

  if(!phone){
    showToast("اكتب رقم الجوال");
    return;
  }

  if(
    deliveryMethod === "delivery" &&
    !address
  ){
    showToast("اكتب العنوان");
    return;
  }

  if(!cart.length){
    showToast("السلة فارغة");
    closeModal();
    return;
  }

  /* Check stock */

  for(const item of cart){

    if(item.type === "digital") continue;

    const product =
      products.find(
        p => String(p.id) ===
             String(item.productId)
      );

    if(
      !product ||
      Number(product.quantity) < Number(item.quantity)
    ){
      showToast(
        `الكمية غير متوفرة: ${item.name}`
      );
      return;
    }
  }


  const orderNumber =
    "NEXO-" +
    Date.now().toString().slice(-8);


  const subtotal =
    getCartSubtotal();

  const discount =
    subtotal - getCartTotal();

  const delivery =
    deliveryMethod === "pickup"
      ? 0
      : getDeliveryFee();

  const total =
    getCartTotal() + delivery;


  const order = {

    id:orderNumber,

    orderNumber,

    customer:{
      name,
      phone,
      email
    },

    address,

    deliveryMethod,

    paymentMethod:selectedPayment,

    note,

    items:cart.map(item=>({

      productId:item.productId,

      name:item.name,

      price:Number(item.price || 0),

      quantity:Number(item.quantity || 1),

      total:
        getItemPrice(
          {price:item.price},
          item.quantity
        ) * item.quantity,

      options:item.options || {},

      digitalLink:item.digitalLink || ""

    })),

    subtotal,

    discount,

    deliveryFee:delivery,

    total,

    status:"new",

    createdAt:new Date().toISOString()

  };


  try{

    /* Firebase */

    const ordersRef =
      ref(db,"nexo_store/orders");

    const newOrderRef =
      push(ordersRef);

    await set(
      newOrderRef,
      order
    );


    /* Local backup */

    orders.unshift(order);

    saveJSON(K.orders,orders);


    /* Clear cart */

    cart = [];

    saveJSON(K.cart,cart);

    updateCartCount();

    renderCart();


    /* Success */

    showOrderSuccess(order);


  }catch(error){

    console.error(
      "ORDER ERROR:",
      error
    );

    /*
      Save locally if Firebase temporarily fails.
    */

    orders.unshift(order);

    saveJSON(K.orders,orders);

    cart = [];

    saveJSON(K.cart,cart);

    updateCartCount();

    renderCart();

    showOrderSuccess(
      order,
      true
    );
  }
};


/* =========================================================
   SUCCESS
========================================================= */

function showOrderSuccess(order,offline=false){

    <div class="success">

      <div class="success-icon">
        ✓
      </div>

      <h2>
        تم استلام طلبك
      </h2>

        ${
          offline
          ?
          "تم حفظ الطلب على الجهاز، وسيتم مزامنته عند توفر الاتصال."
          :
          "تم إرسال طلبك بنجاح إلى المتجر."
        }
      </p>

      <div class="order-number">
        ${escapeHTML(order.orderNumber)}
      </div>

      <p style="font-size:13px;color:#777">
        احتفظ برقم الطلب للاستعلام عن حالته.
      </p>

/* =========================================================
   TRACKING
========================================================= */

window.openTrack = function(initialNumber=""){

  openModal(`

    <div class="modal-head">

      <h3>
        استعلام الطلب
      </h3>

      <button
        class="close"
        onclick="closeModal()"
      >
        ✕
      </button>

    </div>

    <div class="track-box">

      <p style="color:#777;font-size:13px">
        أدخل رقم الطلب لمعرفة حالته.
      </p>

      <div class="track-input">

        <input
          id="trackNumber"
          value="${escapeHTML(initialNumber)}"
          placeholder="مثال: NEXO-12345678"
        >

        <button onclick="trackOrder()">
          بحث
        </button>

      </div>

      <div id="trackResult"></div>

    </div>

  `);

  if(initialNumber){
    setTimeout(
      ()=>trackOrder(),
      100
    );
  }
};


window.trackOrder = function(){

  const input =
    document.getElementById("trackNumber");

  const result =
    document.getElementById("trackResult");

  if(!input || !result) return;

  const number =
    input.value.trim().toUpperCase();

  if(!number){

    result.innerHTML = `
      <div class="track-result">
        اكتب رقم الطلب أولًا.
      </div>
    `;

    return;
  }


  const order =
    orders.find(
      o =>
        String(
          o.orderNumber ||
          o.id ||
          ""
        ).toUpperCase() === number
    );


  if(!order){

    result.innerHTML = `
      <div class="track-result">
        لم يتم العثور على الطلب.
      </div>
    `;

    return;
  }


  const statusMap = {

    new:{
      title:"تم استلام الطلب",
      icon:"📦"
    },

    processing:{
      title:"قيد التجهيز",
      icon:"⚙️"
    },

    out:{
      title:"خرج للتوصيل",
      icon:"🚚"
    },

    delivered:{
      title:"تم التسليم",
      icon:"✅"
    },

    cancelled:{
      title:"تم إلغاء الطلب",
      icon:"❌"
    }

  };


  const status =
    statusMap[order.status] ||
    statusMap.new;


  result.innerHTML = `

    <div class="track-result">

      <div style="font-weight:800">
        ${escapeHTML(
          order.orderNumber ||
          order.id
        )}
      </div>

      <div class="status">
        ${status.icon}
        ${status.title}
      </div>

      <div style="font-size:13px;line-height:2">

        <div>
          العميل:
          ${escapeHTML(
            order.customer?.name ||
            ""
          )}
        </div>

        <div>
          الإجمالي:
          <strong>
            ${money(order.total)}
          </strong>
        </div>

        <div>
          تاريخ الطلب:
          ${formatDate(order.createdAt)}
        </div>

      </div>

    </div>

  `;
};


/* =========================================================
   DATE
========================================================= */

function formatDate(date){

  if(!date) return "-";

  try{

    return new Date(date)
      .toLocaleString(
        "ar-SA",
        {
          dateStyle:"medium",
          timeStyle:"short"
        }
      );

  }catch(e){

    return "-";
  }
}


/* =========================================================
   MODAL
========================================================= */

function openModal(html){

  const modal =
    document.getElementById("modal");

  const box =
    document.getElementById("modalBox");

  box.innerHTML = html;

  modal.classList.remove("hidden");

  document.getElementById("overlay")
    .classList.remove("hidden");
}


window.closeModal = function(){

  document.getElementById("modal")
    .classList.add("hidden");

  document.getElementById("modalBox")
    .innerHTML = "";

  if(
    !document
      .getElementById("cartDrawer")
      .classList.contains("open")
  ){

    document.getElementById("overlay")
      .classList.add("hidden");
  }
};


window.closeAllPanels = function(){

  document.getElementById("cartDrawer")
    .classList.remove("open");

  document.getElementById("modal")
    .classList.add("hidden");

  document.getElementById("overlay")
    .classList.add("hidden");
};
