<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXO STORE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#111827;
  --accent:#2563eb;
  --accent2:#60a5fa;
  --green:#16a34a;
  --red:#dc2626;
  --bg:#f6f7f9;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --shadow:0 14px 40px rgba(17,24,39,.09);
  --glow:0 0 25px rgba(37,99,235,.16);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  font-family:"Cairo",sans-serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(37,99,235,.035),transparent 28%),
    radial-gradient(circle at 90% 30%,rgba(96,165,250,.035),transparent 28%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.loader-screen{
  position:fixed;
  inset:0;
  background:#fff;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.5s ease;
}

.loader-box{text-align:center;width:90%;max-width:350px}

.loader-logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:2px;
  animation:logoPulse 1.5s ease-in-out infinite;
}

.loader-logo span{color:var(--accent)}

.loader-line{
  height:5px;
  width:100%;
  background:#e5e7eb;
  border-radius:50px;
  overflow:hidden;
  margin-top:20px;
}

.loader-line div{
  width:0;
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  animation:loading 1.5s ease forwards;
}

@keyframes loading{to{width:100%}}
@keyframes logoPulse{50%{transform:scale(1.035)}}

header{
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  width:min(1200px,94%);
  margin:auto;
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:900;
  white-space:nowrap;
  transition:.25s
}

.logo span{color:var(--accent)}
.logo:hover{transform:translateY(-1px)}

.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.header-btn{
  border:1px solid var(--line);
  background:#fff;
  min-height:43px;
  padding:0 15px;
  border-radius:13px;
  font-weight:700;
  color:var(--text);
  transition:.25s ease;
}

.header-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
  box-shadow:var(--glow);
  transform:translateY(-2px);
}

.cart-btn{
  position:relative;
  display:flex;
  align-items:center;
  gap:7px;
}

.cart-badge{
  min-width:21px;
  height:21px;
  padding:0 5px;
  border-radius:50px;
  background:linear-gradient(135deg,#ef4444,#dc2626);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
}

.whatsapp-float{
  position:fixed;
  left:18px;
  bottom:18px;
  z-index:450;
  height:54px;
  padding:0 20px;
  border-radius:50px;
  background:linear-gradient(135deg,#16a34a,#15803d);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-size:14px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(0,0,0,.20);
  transition:.25s ease;
}

.whatsapp-float:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 12px 30px rgba(22,163,74,.25);
}

.hero{
  width:min(1200px,94%);
  margin:25px auto 20px;
  background:
    radial-gradient(circle at 85% 15%,rgba(96,165,250,.22),transparent 25%),
    linear-gradient(135deg,#111827,#1e40af);
  color:#fff;
  border-radius:28px;
  padding:45px 35px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

.hero h1{
  font-size:clamp(28px,5vw,48px);
  font-weight:900;
  line-height:1.2;
  margin-bottom:10px;
}

.hero p{
  color:#dbeafe;
  font-size:16px;
  max-width:700px;
  line-height:2;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:22px;
}

.hero-btn{
  border:0;
  padding:13px 20px;
  border-radius:14px;
  font-weight:800;
  background:#fff;
  color:#111827;
  transition:.25s;
}

.hero-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(0,0,0,.18);
}

.hero-btn.secondary{
  background:rgba(255,255,255,.12);
  color:#fff;
  border:1px solid rgba(255,255,255,.25);
}

.container{
  width:min(1200px,94%);
  margin:auto
}

.search-box{
  display:flex;
  gap:10px;
  margin:25px 0 15px;
}

.search-box input{
  flex:1;
  height:50px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
  padding:0 17px;
  outline:none;
  font-size:14px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 0 15px;
}

.category-btn{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#fff;
  padding:10px 17px;
  border-radius:12px;
  font-weight:700;
  transition:.25s;
}

.category-btn.active{
  background:linear-gradient(135deg,var(--primary),#26344d);
  color:#fff;
  border-color:var(--primary);
}

.section-title{
  font-size:24px;
  font-weight:900;
  margin:10px 0 18px;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px;
  padding-bottom:40px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:21px;
  overflow:hidden;
  transition:.3s ease;
  box-shadow:0 4px 15px rgba(0,0,0,.03);
  cursor:pointer;
}

.card:hover{
  transform:translateY(-7px);
  box-shadow:var(--shadow),var(--glow);
}

.pic{
  height:240px;
  background:#f8fafc;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  border-bottom:1px solid var(--line);
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.card-body{padding:16px}
.card-name{font-size:17px;font-weight:900;margin-bottom:7px}
.card-price{font-size:20px;font-weight:900;color:var(--accent);margin-bottom:10px}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.type-badge{background:#eff6ff;color:#1d4ed8;border-radius:9px;padding:5px 8px;font-size:11px;font-weight:800}
.available{color:var(--green);font-size:12px;font-weight:800}

.add-btn{
  width:100%;
  height:45px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,var(--primary),#26344d);
  color:#fff;
  font-weight:800;
  transition:.25s ease;
}

.empty{
  background:#fff;
  border:1px dashed #d1d5db;
  padding:40px;
  text-align:center;
  border-radius:20px;
  color:var(--muted);
  grid-column:1/-1;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(4px);
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.open{display:flex}

.modal-box{
  background:#fff;
  width:min(650px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:25px;
  padding:22px;
  box-shadow:0 20px 70px rgba(0,0,0,.25);
}

.product-modal-box{width:min(950px,100%)}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.modal-title{font-size:22px;font-weight:900}

.close-btn{
  width:40px;
  height:40px;
  border:0;
  background:#f3f4f6;
  border-radius:12px;
  font-size:18px;
}

.product-details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.product-detail-image{
  min-height:420px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.product-detail-image img{width:100%;height:100%;object-fit:contain}

.detail-price{color:var(--accent);font-size:27px;font-weight:900;margin:12px 0}
.detail-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0;font-size:14px}
.detail-label{color:var(--muted)}
.detail-value{font-weight:800}

.description-box{
  margin-top:20px;
  padding:15px;
  background:#f8fafc;
  border-radius:15px;
  border:1px solid var(--line);
}

.detail-add, .checkout-btn{
  width:100%;
  height:50px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,var(--primary),#26344d);
  color:#fff;
  font-weight:900;
  margin-top:15px;
}

.cart-items{display:flex;flex-direction:column;gap:10px}
.cart-item{border:1px solid var(--line);border-radius:15px;padding:12px;display:flex;align-items:center;gap:12px}
.cart-item-img{width:65px;height:65px;background:#f8fafc;border-radius:12px;padding:6px}
.cart-item-img img{width:100%;height:100%;object-fit:contain}
.cart-item-info{flex:1}
.cart-item-name{font-weight:900;font-size:14px}
.cart-item-price{color:var(--accent);font-weight:800;font-size:13px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:900}
.remove-btn{color:var(--red);border:0;background:transparent;font-size:12px;font-weight:800}

.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:800}
.form-group input, .form-group textarea, .form-group select{
  width:100%;border:1px solid var(--line);border-radius:12px;min-height:46px;padding:10px 13px;outline:none;background:#fff;
}

.fulfillment, .payment-options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:17px}
.option{border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center;font-weight:800;cursor:pointer}
.option.active{border-color:var(--accent);background:#eff6ff;color:#1d4ed8}

footer{background:#111827;color:#fff;margin-top:40px;padding:35px 0}
.footer-inner{width:min(1200px,94%);margin:auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

@media(max-width:950px){.products-grid{grid-template-columns:repeat(3,1fr)}.product-details{grid-template-columns:1fr}}
@media(max-width:700px){.products-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <a href="#" class="logo" id="headerLogo">NEXO <span>STORE</span></a>
    <div class="header-actions">
      <button class="header-btn" onclick="openTrack()">🔎 استعلام الطلب</button>
      <button class="header-btn cart-btn" onclick="openCart()">🛒 السلة <span class="cart-badge" id="cartCount">0</span></button>
    </div>
  </div>
</header>

<a class="whatsapp-float" href="https://wa.me/966501203710" target="_blank" rel="noopener">💬 تواصل معنا</a>

<section class="hero">
  <div class="container">
    <h1 id="heroTitle">NEXO STORE</h1>
    <p id="heroDescription">متجرك الإلكتروني للمنتجات الرقمية والمنتجات المتنوعة.</p>
    <div class="hero-actions">
      <button class="hero-btn" onclick="scrollToProducts()">🛍️ تصفح المنتجات</button>
      <button class="hero-btn secondary" onclick="openTrack()">📦 تتبع طلبك</button>
    </div>
  </div>
</section>

<main class="container">
  <div class="search-box">
    <input id="searchInput" type="search" placeholder="ابحث عن منتج..." oninput="renderProducts()">
  </div>

  <div class="categories">
    <button class="category-btn active" onclick="setCategory('all',this)">الكل</button>
    <button class="category-btn" onclick="setCategory('physical',this)">المنتجات المتنوعة</button>
  </div>

  <h2 class="section-title" id="productsTitle">المنتجات</h2>
  <div class="products-grid" id="productsGrid"></div>
</main>

<footer>
  <div class="footer-inner">
    <div>
      <div class="footer-logo">NEXO <span>STORE</span></div>
      <div class="footer-text">متجرك الإلكتروني.</div>
    </div>
    <div class="footer-text">جميع الحقوق محفوظة © <span id="footerYear"></span></div>
  </div>
</footer>

<!-- Modals -->
<div class="modal" id="productModal" onclick="modalOutside(event,'productModal')">
  <div class="modal-box product-modal-box">
    <div class="modal-head">
      <div class="modal-title">تفاصيل المنتج</div>
      <button class="close-btn" onclick="closeProduct()">✕</button>
    </div>
    <div id="productDetails"></div>
  </div>
</div>

<div class="modal" id="cartModal" onclick="modalOutside(event,'cartModal')">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">🛒 سلة المشتريات</div>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div id="cartItems"></div>
  </div>
</div>

<div class="modal" id="checkoutModal" onclick="modalOutside(event,'checkoutModal')">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">إتمام الطلب</div>
      <button class="close-btn" onclick="closeCheckout()">✕</button>
    </div>
    <form id="checkoutForm">
      <div class="form-group"><label>الاسم الكامل</label><input id="customerName" required placeholder="اكتب اسمك"></div>
      <div class="form-group"><label>رقم الجوال</label><input id="customerPhone" required type="tel" placeholder="05xxxxxxxx"></div>
      <div class="form-group"><label>البريد الإلكتروني</label><input id="customerEmail" type="email" placeholder="example@email.com"></div>
      <div class="form-group">
        <label>طريقة الاستلام</label>
        <div class="fulfillment">
          <div class="option active" id="deliveryOption" onclick="selectFulfillment('delivery')">🚚 توصيل</div>
          <div class="option" id="pickupOption" onclick="selectFulfillment('pickup')">📍 استلام بنفسي</div>
        </div>
      </div>
      <div id="deliveryFields">
        <div class="form-group"><label>المدينة</label><input id="customerCity" placeholder="مكة المكرمة"></div>
        <div class="form-group"><label>العنوان</label><textarea id="customerAddress" placeholder="اكتب عنوان التوصيل"></textarea></div>
      </div>
      <div id="pickupInfo" style="display:none;background:#eff6ff;color:#1e40af;padding:14px;border-radius:13px;margin-bottom:15px;"></div>
      <div class="form-group"><label>ملاحظات</label><textarea id="customerNote" placeholder="ملاحظات إضافية..."></textarea></div>
      <div class="form-group">
        <label>طريقة الدفع</label>
        <div class="payment-options">
          <div class="option active" id="cashPayment" onclick="selectPayment('cash')">💵 عند الاستلام</div>
          <div class="option" id="moyasarPayment" onclick="selectPayment('moyasar')">💳 بطاقة</div>
          <div class="option" id="paypalPayment" onclick="selectPayment('paypal')">🅿️ PayPal</div>
        </div>
      </div>
      <div class="checkout-total" id="checkoutSummary"></div>
      <button class="checkout-btn" type="submit">تأكيد الطلب</button>
    </form>
  </div>
</div>

<div class="modal" id="trackModal" onclick="modalOutside(event,'trackModal')">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">🔎 استعلام الطلب</div>
      <button class="close-btn" onclick="closeTrack()">✕</button>
    </div>
    <div class="form-group"><label>رقم الطلب</label><input id="trackNumber" placeholder="مثال: NEXO-12345678"></div>
    <button class="checkout-btn" type="button" onclick="trackOrder()">استعلام</button>
    <div id="trackResult" class="track-result"></div>
  </div>
</div>

<div class="modal" id="successModal">
  <div class="modal-box">
    <div style="text-align:center;padding:15px;">
      <h2>تم استلام طلبك بنجاح</h2>
      <div class="order-code" id="successOrderNumber" style="margin:15px 0;background:#f3f4f6;padding:10px;font-weight:900;border-radius:8px;"></div>
      <div id="successDetails"></div>
      <button class="checkout-btn" onclick="closeSuccess()">تم</button>
    </div>
  </div>
</div>

<script>
// قائمة المنتجات الأصلية مدمجة مع منتجات لوحة التحكم الخاصة بك
let products = [

  { id: "2", name: "كيبل Type-C للايفون - LDNIO LS543 Toughness", price: 23, image: "ldnio-ls543.jpg", type: "physical", description: "كيبل متين وقوي مصمم لتحمل الاستخدام الشاق." },
  { id: "3", name: "كيبل Type-C شحن سريع 3.1A - OVAST OT-15 (ضمان سنة)", price: 16, image: "ovast-ot15.jpg", type: "physical", description: "شحن سريع وآمن مع ضمان لمدة سنة كاملة." },
  { id: "4", name: "ساعة سلكية مع مايكروفون - NITO N-100", price: 35, image: "nito-n100.jpg", type: "physical", description: "صوت نقي وواضح مع مايكروفون مدمج." },

let orders = JSON.parse(localStorage.getItem("nexo_orders") || "[]");
let cart = JSON.parse(localStorage.getItem("nexo_cart") || "[]");
let settings = {};
let currentCategory = "all";
let fulfillment = "delivery";
let payment = "cash";
const PLACEHOLDER = "https://via.placeholder.com/700x500?text=NEXO+STORE";

function money(val) { return Number(val || 0).toFixed(2); }
function escapeHtml(str) { return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function init() {
  renderProducts();
  updateCartCount();
  document.getElementById("footerYear").textContent = new Date().getFullYear();
  setTimeout(() => { document.getElementById("loader").style.display = "none"; }, 1000);
}

function setCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  renderProducts();
}

function renderProducts() {
  const grid = document.getElementById("productsGrid");
  const search = document.getElementById("searchInput").value.trim().toLowerCase();
  
  const filtered = products.filter(p => p.name.toLowerCase().includes(search));

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">لا توجد منتجات مطابقة للبحث.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <article class="card" onclick="openProduct('${p.id}')">
      <div class="pic">
        <img src="${p.image}" alt="${escapeHtml(p.name)}" onerror="this.src='${PLACEHOLDER}'">
      </div>
      <div class="card-body">
        <div class="card-name">${escapeHtml(p.name)}</div>
        <div class="card-price">${money(p.price)} ر.س</div>
        <div class="card-meta">
          <span class="type-badge">منتج متنوع</span>
          <span class="available">متوفر</span>
        </div>
        <button class="add-btn" onclick="event.stopPropagation();addToCart('${p.id}')">🛒 أضف للسلة</button>
      </div>
    </article>
  `).join("");
}

function openProduct(id) {
  const p = products.find(x => x.id === id);
  if(!p) return;
  document.getElementById("productDetails").innerHTML = `
    <div class="product-details">
      <div class="product-detail-image"><img src="${p.image}" onerror="this.src='${PLACEHOLDER}'"></div>
      <div class="product-detail-info">
        <h2>${escapeHtml(p.name)}</h2>
        <div class="detail-price">${money(p.price)} ر.س</div>
        <div class="description-box"><h3>وصف المنتج</h3><p>${escapeHtml(p.description)}</p></div>
        <button class="detail-add" onclick="addToCart('${p.id}');closeProduct();">🛒 أضف للسلة</button>
      </div>
    </div>
  `;
  document.getElementById("productModal").classList.add("open");
}

function closeProduct() { document.getElementById("productModal").classList.remove("open"); }

function addToCart(id) {
  const item = cart.find(x => x.id === id);
  if(item) item.quantity++;
  else cart.push({id, quantity:1});
  localStorage.setItem("nexo_cart", JSON.stringify(cart));
  updateCartCount();
  alert("تمت إضافة المنتج إلى السلة بنجاح");
}

function updateCartCount() {
  const count = cart.reduce((sum, item) => sum + item.quantity, 0);
  document.getElementById("cartCount").textContent = count;
}

function openCart() {
  const box = document.getElementById("cartItems");
  if(!cart.length) {
    box.innerHTML = `<div class="empty">السلة فارغة حالياً.</div>`;
  } else {
    let subtotal = 0;
    box.innerHTML = `<div class="cart-items">` + cart.map(item => {
      const p = products.find(x => x.id === item.id);
      if(!p) return "";
      subtotal += p.price * item.quantity;
      return `
        <div class="cart-item">
          <div class="cart-item-img"><img src="${p.image}"></div>
          <div class="cart-item-info">
            <div class="cart-item-name">${escapeHtml(p.name)}</div>
            <div class="cart-item-price">${money(p.price)} ر.س (الكمية: ${item.quantity})</div>
          </div>
          <button class="remove-btn" onclick="removeFromCart('${item.id}')">حذف</button>
        </div>
      `;
    }).join("") + `</div>
    <div style="margin-top:15px;font-weight:900;font-size:18px;">المجموع الإجمالي: ${money(subtotal)} ر.س</div>
    <button class="checkout-btn" onclick="openCheckout()">متابعة لإتمام الطلب</button>`;
  }
  document.getElementById("cartModal").classList.add("open");
}

function closeCart() { document.getElementById("cartModal").classList.remove("open"); }

function removeFromCart(id) {
  cart = cart.filter(x => x.id !== id);
  localStorage.setItem("nexo_cart", JSON.stringify(cart));
  updateCartCount();
  openCart();
}

function openCheckout() {
  if(!cart.length) return alert("السلة فارغة");
  closeCart();
  document.getElementById("checkoutModal").classList.add("open");
}

function closeCheckout() { document.getElementById("checkoutModal").classList.remove("open"); }

function selectFulfillment(type) {
  fulfillment = type;
  document.getElementById("deliveryOption").classList.toggle("active", type === 'delivery');
  document.getElementById("pickupOption").classList.toggle("active", type === 'pickup');
  document.getElementById("deliveryFields").style.display = type === 'delivery' ? 'block' : 'none';
}

function selectPayment(type) {
  payment = type;
  document.getElementById("cashPayment").classList.toggle("active", type === 'cash');
  document.getElementById("moyasarPayment").classList.toggle("active", type === 'moyasar');
  document.getElementById("paypalPayment").classList.toggle("active", type === 'paypal');
}

document.getElementById("checkoutForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const orderNumber = "NEXO-" + Math.floor(100000 + Math.random() * 900000);
  orders.push({ orderNumber, cart, date: new Date().toISOString() });
  localStorage.setItem("nexo_orders", JSON.stringify(orders));
  cart = [];
  localStorage.setItem("nexo_cart", JSON.stringify(cart));
  updateCartCount();
  closeCheckout();
  
  document.getElementById("successOrderNumber").textContent = orderNumber;
  document.getElementById("successModal").classList.add("open");
});

function closeSuccess() { document.getElementById("successModal").classList.remove("open"); }
function openTrack() { document.getElementById("trackModal").classList.add("open"); }
function closeTrack() { document.getElementById("trackModal").classList.remove("open"); }

function trackOrder() {
  const num = document.getElementById("trackNumber").value.trim().toUpperCase();
  const res = document.getElementById("trackResult");
  const order = orders.find(x => x.orderNumber === num);
  if(order) {
    res.innerHTML = `<div style="background:#f8fafc;padding:15px;border-radius:12px;margin-top:10px;"><strong>حالة الطلب:</strong> تم استلام طلبك بنجاح وسيتم تجهيزه قريباً.</div>`;
  } else {
    res.innerHTML = `<div style="background:#ffeeef;color:red;padding:15px;border-radius:12px;margin-top:10px;">لم يتم العثور على الطلب.</div>`;
  }
}

function scrollToProducts() { document.getElementById("productsTitle").scrollIntoView({behavior:"smooth"}); }
function modalOutside(e, id) { if(e.target.id === id) document.getElementById(id).classList.remove("open"); }

init();
</script>

</body>
</html>
