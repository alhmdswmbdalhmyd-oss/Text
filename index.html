<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الذكي - متصل بـ Firebase</title>
    <!-- Tailwind CSS للتصميم السريع والاحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبات FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- شريط التنقل العلوي -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2 space-x-reverse">
                <i class="fa-solid fa-store text-indigo-600 text-2xl"></i>
                <span class="text-xl font-bold text-gray-900">متجري الرقمي</span>
            </div>
            <div class="flex items-center space-x-4 space-x-reverse">
                <button onclick="openAdminModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
                    <i class="fa-solid fa-gear ml-1"></i> لوحة الإدارة
                </button>
                <div class="relative cursor-pointer" onclick="toggleCartModal()">
                    <i class="fa-solid fa-cart-shopping text-2xl text-gray-700"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-indigo-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto px-4 py-8">
        
        <!-- قسم الترحيب -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl p-8 mb-10 shadow-lg text-center md:text-right flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold mb-2">أهلاً بك في متجرك السحابي الفوري</h1>
                <p class="text-indigo-100 text-sm md:text-base">المنتجات تتحدث لحظياً وتظهر على جميع الجوالات عبر Firebase!</p>
            </div>
            <div class="mt-6 md:mt-0">
                <button onclick="openAdminModal()" class="bg-white text-indigo-600 font-bold px-6 py-3 rounded-xl shadow hover:bg-indigo-50 transition">
                    أضف منتج جديد الآن
                </button>
            </div>
        </div>

        <!-- شبكة عرض المنتجات -->
        <h2 class="text-2xl font-bold mb-6 text-gray-800 border-r-4 border-indigo-600 pr-3">منتجات المتجر</h2>
        
        <!-- مؤشر التحميل -->
        <div id="loading-spinner" class="text-center py-12">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600"></i>
            <p class="text-gray-500 mt-2">جاري جلب المنتجات من قاعدة البيانات...</p>
        </div>

        <!-- حاوية المنتجات -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- سيتم تعبئة المنتجات ديناميكياً هنا -->
        </div>
    </main>

    <!-- نافذة إضافة منتج (لوحة الإدارة المبسطة) -->
    <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
            <button onclick="closeAdminModal()" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 class="text-xl font-bold mb-4 text-gray-900 border-b pb-2">إضافة منتج جديد لـ Firebase</h3>
            
            <form id="add-product-form" onsubmit="addNewProduct(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">اسم المنتج</label>
                    <input type="text" id="prod-name" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">السعر (ر.س)</label>
                    <input type="number" id="prod-price" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">رابط صورة المنتج (URL)</label>
                    <input type="url" id="prod-image" required placeholder="https://example.com/image.jpg" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">وصف قصير</label>
                    <textarea id="prod-desc" rows="2" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
                <button type="submit" id="save-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow">
                    حفظ وإرسال إلى القاعدة السحابية
                </button>
            </form>
        </div>
    </div>

    <!-- سكريبتات Firebase والتطبيق -->
    <script type="module">
        // استيراد مكتبات Firebase (الإصدار الحديث Modular SDK)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: استبدل هذه الإعدادات بإعدادات مشروعك الحقيقي من لوحة تحكم Firebase
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cart = [];

        // دالة جلب وعرض المنتجات بالاستماع اللحظي (Real-time updates)
        function initRealtimeProducts() {
            const grid = document.getElementById('products-grid');
            const spinner = document.getElementById('loading-spinner');

            const q = query(collection(db, "products"));
            
            // onSnapshot يضمن تحديث المنتجات على جميع الجوالات فوراً عند إضافة منتج جديد
            onSnapshot(q, (snapshot) => {
                grid.innerHTML = "";
                spinner.style.display = "none";

                if (snapshot.empty) {
                    grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">لا توجد منتجات حالياً. أضف منتجك الأول من لوحة الإدارة!</div>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const product = docSnap.data();
                    const productId = docSnap.id;

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl shadow hover:shadow-lg transition overflow-hidden border border-gray-100 flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <img src="${product.image || 'https://via.placeholder.com/300'}" alt="${product.name}" class="w-full h-48 object-cover">
                            <div class="p-4">
                                <h3 class="font-bold text-lg mb-1 text-gray-900">${product.name}</h3>
                                <p class="text-gray-500 text-sm mb-3 line-clamp-2">${product.description || ''}</p>
                                <span class="text-indigo-600 font-extrabold text-lg">${product.price} ر.س</span>
                            </div>
                        </div>
                        <div class="p-4 pt-0">
                            <button onclick="addToCart('${productId}', '${product.name}', ${product.price})" class="w-full bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white font-bold py-2 rounded-xl transition text-sm">
                                <i class="fa-solid fa-cart-plus ml-1"></i> أضف إلى السلة
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }, (error) => {
                console.error("خطأ في جلب البيانات: ", error);
                spinner.innerHTML = `<p class="text-red-500">حدث خطأ في الاتصال بقاعدة البيانات. تأكد من إعدادات Firebase.</p>`;
            });
        }

        // دالة إضافة منتج جديد وإرساله إلى Firebase
        window.addNewProduct = async function(event) {
            event.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerText = "جاري الحفظ بالسحاب...";

            const name = document.getElementById('prod-name').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const image = document.getElementById('prod-image').value;
            const description = document.getElementById('prod-desc').value;

            try {
                await addDoc(collection(db, "products"), {
                    name,
                    price,
                    image,
                    description,
                    createdAt: new Date()
                });

                document.getElementById('add-product-form').reset();
                closeAdminModal();
                alert("تم إضافة المنتج بنجاح وظهر على جميع الأجهزة!");
            } catch (e) {
                console.error("خطأ أثناء الإضافة: ", e);
                alert("حدث خطأ أثناء حفظ المنتج.");
            } finally {
                btn.disabled = false;
                btn.innerText = "حفظ وإرسال إلى القاعدة السحابية";
            }
        }

        // دوال التحكم في النوافذ المنبثقة
        window.openAdminModal = function() {
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        window.closeAdminModal = function() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        window.addToCart = function(id, name, price) {
            cart.push({ id, name, price });
            document.getElementById('cart-count').innerText = cart.length;
            alert(`تمت إضافة "${name}" إلى سلة المشتريات.`);
        }

        window.toggleCartModal = function() {
            if(cart.length === 0) {
                alert("سلة المشتريات فارغة حالياً.");
            } else {
                let total = cart.reduce((sum, item) => sum + item.price, 0);
                alert(`لديك ${cart.length} منتج في السلة.\nالمجموع الكلي: ${total} ر.س`);
            }
        }

        // تشغيل نظام الجلب اللحظي عند تحميل الصفحة
        initRealtimeProducts();
    </script>
</body>
</html>
